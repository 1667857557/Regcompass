name: FASTCORE parallel cache checks

on:
  pull_request:
    paths:
      - 'R/layer2_parallel_runtime.R'
      - 'R/celltype_union_gem_cache.R'
      - 'tests/fastcore-parallel-cache-check.R'
      - '.github/workflows/fastcore-parallel-cache-checks.yaml'
  push:
    branches: [Main]
    paths:
      - 'R/layer2_parallel_runtime.R'
      - 'R/celltype_union_gem_cache.R'
      - 'tests/fastcore-parallel-cache-check.R'
      - '.github/workflows/fastcore-parallel-cache-checks.yaml'

permissions:
  contents: read

jobs:
  fastcore-parallel-cache:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Parse affected sources and regression
        shell: Rscript {0}
        run: |
          files <- c(
            'R/layer2_parallel_runtime.R',
            'R/celltype_union_gem_cache.R',
            'tests/fastcore-parallel-cache-check.R'
          )
          for (file in files) parse(file = file)

      - name: Run FASTCORE task and cleanup regression
        run: Rscript tests/fastcore-parallel-cache-check.R

      - name: Audit parallel and memory contracts
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('R/layer2_parallel_runtime.R').read_text()
          cache = Path('R/celltype_union_gem_cache.R').read_text()

          runtime_required = [
              '.rc_layer2_tune_task_bpparam',
              '"bpnworkers<-"',
              '"bptasks<-"',
              'regcompass_layer2_effective_workers',
          ]
          cache_required = [
              'task_grid <- expand.grid(',
              'rc_parallel_lapply(',
              'suppress_nested = TRUE',
              '.rc_atomic_save_rds(model, file)',
              'rm(model, membership, core, medium, selected_targets, build)',
              'gc(verbose = FALSE, full = TRUE)',
              'parts[i] <- list(NULL)',
              'fastcore_worker_cleanup',
              'structural_parallel_workers',
          ]
          missing = [x for x in runtime_required if x not in runtime]
          missing += [x for x in cache_required if x not in cache]
          if missing:
              raise RuntimeError(f'FASTCORE parallel/cache contract missing: {missing}')

          old_serial_markers = [
              'for (cell_type in scoped$cell_types)',
              'for (scenario in scenarios)',
              'saveRDS(model, file)',
          ]
          found = [x for x in old_serial_markers if x in cache]
          if found:
              raise RuntimeError(
                  f'legacy serial/non-atomic FASTCORE cache markers remain: {found}'
              )
