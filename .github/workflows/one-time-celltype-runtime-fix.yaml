name: One-time cell-type runtime contract fix

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Apply direct runtime fix
        run: python .github/scripts/fix_celltype_runtime.py
      - name: Parse all R sources
        shell: Rscript {0}
        run: |
          files <- list.files("R", pattern = "[.]R$", full.names = TRUE)
          for (file in files) {
            tryCatch(
              parse(file = file),
              error = function(e) stop(file, ": ", conditionMessage(e))
            )
          }
      - name: Verify dispatcher and structural boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          rdir = Path('R')
          text = '\n'.join(path.read_text() for path in rdir.glob('*.R'))
          if text.count('.rc_run_microcompass_engine <- function(') != 1:
              raise RuntimeError('microCOMPASS dispatcher is not unique')
          for required in (
              '.rc_run_celltype_microcompass_engine',
              '.rc_run_shared_full_gem_engine',
              'shared_across_cell_types = FALSE',
              'all(cache_celltypes %in% unit_celltypes)'
          ):
              if required not in text:
                  raise RuntimeError(f'missing runtime contract: {required}')
          for retired in (
              '.rc_build_medium_specific_union_gem_cache',
              '.rc_complete_medium_union_gem',
              '.rc_read_cached_union_gem'
          ):
              if retired in text:
                  raise RuntimeError(f'retired global path remains: {retired}')

          definitions = {}
          pattern = re.compile(
              r'(?m)^([A-Za-z.][A-Za-z0-9._]*)\s*<-\s*function\b'
          )
          for path in sorted(rdir.glob('*.R')):
              for match in pattern.finditer(path.read_text()):
                  definitions.setdefault(match.group(1), []).append(str(path))
          duplicate = {
              name: paths for name, paths in definitions.items()
              if len(paths) > 1
          }
          if duplicate:
              raise RuntimeError(f'duplicate function definitions: {duplicate}')
      - name: Remove temporary migration files
        run: |
          rm .github/scripts/fix_celltype_runtime.py
          rm .github/workflows/one-time-celltype-runtime-fix.yaml
          rmdir .github/scripts 2>/dev/null || true
      - name: Commit direct source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "restore cell-type microCOMPASS runtime dispatch"
          git push origin HEAD:${{ github.head_ref }}
