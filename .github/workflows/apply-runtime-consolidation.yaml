name: Apply runtime consolidation

on:
  push:
    branches:
      - agent/prune-obsolete-api-readme-flow
    paths:
      - 'tools/consolidate_runtime_wrappers.py'
      - 'tools/consolidate_runtime_wrappers_v2.py'
      - '.github/workflows/apply-runtime-consolidation.yaml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-consolidation]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prune-obsolete-api-readme-flow
          fetch-depth: 0

      - name: Consolidate canonical implementations
        run: |
          python tools/consolidate_runtime_wrappers_v2.py
          git diff --check

      - name: Parse transformed R sources
        shell: Rscript {0}
        run: |
          files <- list.files('R', pattern = '[.]R$', full.names = TRUE)
          for (file in files) parse(file = file)

      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No consolidation changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R DESCRIPTION tests/testthat
          git commit -m '[runtime-consolidation] Remove same-name runtime wrappers'
          git push origin HEAD:agent/prune-obsolete-api-readme-flow
