name: Canonicalize internal schema once

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remove internal version label
        shell: python
        run: |
          from pathlib import Path
          old = 'regcompass_condition_grn_common_dictionary_v1'
          new = 'regcompass_condition_grn_common_dictionary'
          roots = [Path('R'), Path('tests'), Path('vignettes')]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if old in text:
                      path.write_text(text.replace(old, new))
                      changed.append(str(path))
          all_r = '\n'.join(
              p.read_text() for p in sorted(Path('R').glob('*.R'))
          )
          if old in all_r:
              raise RuntimeError('RegCompass-owned _v1 schema label remains')
          external = 'pando_condition_grn_common_dictionary_v1'
          if external not in Path('R/condition_grn_contract.R').read_text():
              raise RuntimeError('external Pando schema identifier was changed')
          print('changed:', changed)
      - name: Parse R sources
        shell: Rscript {0}
        run: |
          files <- list.files('R', pattern = '[.]R$', full.names = TRUE)
          for (file in files) parse(file = file)
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R tests vignettes 2>/dev/null || true
          git commit -m 'Canonicalize internal condition-GRN schema label'
          git push origin HEAD:${{ github.head_ref }}
