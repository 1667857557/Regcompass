name: Rank-deficient conditional penalty contract

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Verify E-star boundary sharing and union handoff
        shell: Rscript {0}
        run: |
          `%||%` <- function(x, y) if (is.null(x)) y else x
          .rc_standard_pando_padj_default <- 0.05
          source("R/condition_grn_contract.R")
          source("R/condition_penalty_contract.R")

          coefficient <- data.frame(
            edge_id = c("G||TF||P", "G||TF||P"),
            target = c("G", "G"),
            condition = c("A", "B"),
            estimate = c(0.8, 0.8),
            penalty_effect = c(0.8, 0.8),
            pval = c(0.001, 0.2),
            padj = c(0.01, 0.2),
            inference_estimable = c(TRUE, TRUE),
            condition_significant = c(TRUE, FALSE),
            statistically_supported = c(TRUE, FALSE),
            significant = c(TRUE, FALSE),
            pando_estimation_active = c(TRUE, TRUE),
            active = c(TRUE, TRUE),
            edge_union_supported = c(TRUE, TRUE),
            supporting_conditions = c("A", "A"),
            n_supporting_conditions = c(1L, 1L),
            all_conditions_fit_valid = c(TRUE, TRUE),
            active_in_regcompass = c(TRUE, TRUE),
            fit_status = c("ok", "ok"),
            penalty_family = c(
              "information_scaled_sparse_deviation",
              "information_scaled_sparse_deviation"
            ),
            penalty_value = c(0.25, 0.25),
            solver_status = c("ok", "ok"),
            kkt_residual = c(1e-10, 1e-10),
            iterations = c(20L, 20L),
            contrast_identifiable = c(FALSE, FALSE),
            shared_by_boundary = c(TRUE, TRUE),
            fused_by_penalty = c(FALSE, FALSE),
            stringsAsFactors = FALSE
          )

          gate <- .rc_condition_penalty_gate(
            coefficient, padj_threshold = 0.05,
            target_rsq_threshold = 0.05
          )
          stopifnot(identical(gate, c(TRUE, TRUE)))
          stopifnot(
            identical(coefficient$contrast_identifiable, c(FALSE, FALSE)),
            identical(coefficient$shared_by_boundary, c(TRUE, TRUE)),
            identical(coefficient$fused_by_penalty, c(FALSE, FALSE))
          )

          invalid <- coefficient
          invalid$fit_status[[2]] <- "failed"
          invalid$all_conditions_fit_valid <- FALSE
          invalid$edge_union_supported <- FALSE
          invalid$active_in_regcompass <- FALSE
          stopifnot(identical(
            .rc_condition_penalty_gate(
              invalid, padj_threshold = 0.05,
              target_rsq_threshold = 0.05
            ),
            c(FALSE, FALSE)
          ))

          no_support <- coefficient
          no_support$padj <- c(0.2, 0.3)
          no_support$condition_significant <- FALSE
          no_support$statistically_supported <- FALSE
          no_support$significant <- FALSE
          no_support$edge_union_supported <- FALSE
          no_support$supporting_conditions <- ""
          no_support$n_supporting_conditions <- 0L
          no_support$active_in_regcompass <- FALSE
          stopifnot(identical(
            .rc_condition_penalty_gate(
              no_support, padj_threshold = 0.05,
              target_rsq_threshold = 0.05
            ),
            c(FALSE, FALSE)
          ))
