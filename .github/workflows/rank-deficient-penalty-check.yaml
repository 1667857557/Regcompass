name: Rank-deficient penalty contract

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Verify regularized rank deficiency remains diagnostic
        shell: Rscript {0}
        run: |
          .rc_standard_pando_padj_default <- 0.05
          .rc_require_pando_condition_grn_fit <- function(x) invisible(TRUE)
          source("R/condition_penalty_contract.R")

          # Raw rank deficiency remains diagnostic under ridge. Candidate
          # correlation provenance does not veto an estimable BH-supported edge.
          # This direct gate is intentionally edge/fit-status only; target model
          # quality is composed separately in .rc_apply_condition_penalty_gate().
          make_coef <- function(threshold) {
            estimate <- c(1, 1, 1, 1)
            estimable <- c(TRUE, TRUE, FALSE, TRUE)
            padj <- c(0.01, 0.08, NA_real_, 0.01)
            statistically_supported <- estimable & is.finite(estimate) &
              is.finite(padj) & padj < threshold
            global_support <- c(TRUE, TRUE, TRUE, FALSE)
            local_support <- c(FALSE, FALSE, TRUE, FALSE)
            active <- statistically_supported
            data.frame(
              estimate = estimate,
              estimable = estimable,
              padj = padj,
              statistically_supported = statistically_supported,
              global_support = global_support,
              local_support = local_support,
              active = active,
              significant = active,
              penalty_effect = ifelse(active, estimate, 0),
              fit_status = c("ok", "ok", "ok", "failed"),
              design_rank_deficient = c(FALSE, TRUE, TRUE, FALSE),
              stringsAsFactors = FALSE
            )
          }
          coefficient <- make_coef(0.1)
          stopifnot(identical(
            .rc_condition_penalty_gate(coefficient, padj_threshold = 0.1),
            c(TRUE, TRUE, FALSE, FALSE)
          ))
          coefficient <- make_coef(0.05)
          stopifnot(identical(
            .rc_condition_penalty_gate(coefficient, padj_threshold = 0.05),
            c(TRUE, FALSE, FALSE, FALSE)
          ))

          coefficient <- data.frame(
            target = c("G", "G"),
            condition = c("A", "B"),
            estimate = c(0.8, -0.7),
            estimable = c(TRUE, FALSE),
            pval = c(0.001, NA_real_),
            padj = c(0.01, NA_real_),
            statistically_supported = c(TRUE, FALSE),
            global_support = c(FALSE, TRUE),
            local_support = c(FALSE, FALSE),
            active = c(TRUE, FALSE),
            significant = c(TRUE, FALSE),
            penalty_effect = c(0.8, 0),
            stringsAsFactors = FALSE
          )
          fit <- structure(list(
            padj_threshold = 0.05,
            coefficients = coefficient,
            fit = data.frame(
              target = c("G", "G"),
              condition = c("A", "B"),
              fit_status = c("ok", "ok"),
              rsq = c(0.20, 0.20),
              rsq_in_sample = c(0.20, 0.20),
              rsq_oof = c(-0.10, -0.20),
              design_rank_deficient = c(TRUE, TRUE),
              stringsAsFactors = FALSE
            )
          ), class = c("ConditionGRNFit", "list"))
          gated <- .rc_apply_condition_penalty_gate(fit)
          stopifnot(
            identical(gated$coefficients$fit_status, c("ok", "ok")),
            identical(as.numeric(gated$coefficients$penalty_effect), c(0.8, 0)),
            identical(as.logical(gated$coefficients$target_model_supported),
                      c(TRUE, TRUE)),
            identical(as.logical(gated$coefficients$penalty_eligible),
                      c(TRUE, FALSE)),
            identical(
              gated$regcompass_rank_deficient_policy,
              "regularized_ok_fit_retained; non-estimable condition edge excluded"
            ),
            identical(gated$regcompass_significance_role,
                      "consume_pando_condition_bh_active_edge_without_reselection")
          )
