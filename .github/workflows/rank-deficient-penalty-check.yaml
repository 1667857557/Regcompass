name: Rank-deficient penalty contract

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Verify Scheme-E rank deficiency remains diagnostic
        shell: Rscript {0}
        run: |
          `%||%` <- function(x, y) if (is.null(x)) y else x
          .rc_standard_pando_padj_default <- 0.05
          .rc_require_pando_condition_grn_fit <- function(x) invisible(TRUE)
          source("R/condition_penalty_contract.R")

          # Scheme E keeps every finite fixed-dictionary coefficient from a
          # successful fit. BH, raw rank deficiency and target R2 are diagnostic;
          # an unidentifiable contrast is exact-shared rather than deleted.
          make_coef <- function(threshold) {
            estimate <- c(1, 1, 1, 1)
            padj <- c(0.01, 0.08, NA_real_, 0.01)
            statistically_supported <- is.finite(estimate) &
              is.finite(padj) & padj < threshold
            data.frame(
              estimate = estimate,
              estimable = c(TRUE, TRUE, FALSE, TRUE),
              padj = padj,
              statistically_supported = statistically_supported,
              global_support = c(TRUE, TRUE, TRUE, FALSE),
              local_support = c(FALSE, FALSE, TRUE, FALSE),
              active = rep(TRUE, 4L),
              significant = statistically_supported,
              penalty_effect = estimate,
              contrast_identifiable = c(TRUE, TRUE, FALSE, TRUE),
              shared_by_boundary = c(FALSE, FALSE, TRUE, FALSE),
              fused_by_penalty = c(FALSE, TRUE, FALSE, FALSE),
              penalty_family = rep("exact_edge_sparse_deviation", 4L),
              penalty_value = rep(0.25, 4L),
              solver_status = rep("ok", 4L),
              kkt_residual = rep(1e-8, 4L),
              iterations = rep(20L, 4L),
              fit_status = c("ok", "ok", "ok", "failed"),
              rsq = c(0.8, 0.01, 0.6, 0.9),
              design_rank_deficient = c(FALSE, TRUE, TRUE, FALSE),
              stringsAsFactors = FALSE
            )
          }
          coefficient <- make_coef(0.1)
          stopifnot(identical(
            .rc_condition_penalty_gate(coefficient, padj_threshold = 0.1),
            c(TRUE, TRUE, TRUE, FALSE)
          ))
          coefficient <- make_coef(0.05)
          stopifnot(identical(
            .rc_condition_penalty_gate(coefficient, padj_threshold = 0.05),
            c(TRUE, TRUE, TRUE, FALSE)
          ))

          coefficient <- data.frame(
            target = c("G", "G"),
            condition = c("A", "B"),
            estimate = c(0.8, 0.8),
            estimable = c(TRUE, FALSE),
            pval = c(0.001, NA_real_),
            padj = c(0.01, NA_real_),
            statistically_supported = c(TRUE, FALSE),
            global_support = c(FALSE, TRUE),
            local_support = c(FALSE, FALSE),
            active = c(TRUE, TRUE),
            significant = c(TRUE, FALSE),
            penalty_effect = c(0.8, 0.8),
            contrast_identifiable = c(FALSE, FALSE),
            shared_by_boundary = c(TRUE, TRUE),
            fused_by_penalty = c(FALSE, FALSE),
            penalty_family = c(
              "exact_edge_sparse_deviation", "exact_edge_sparse_deviation"
            ),
            penalty_value = c(0.25, 0.25),
            solver_status = c("ok", "ok"),
            kkt_residual = c(1e-8, 1e-8),
            iterations = c(20L, 20L),
            stringsAsFactors = FALSE
          )
          fit <- structure(list(
            padj_threshold = 0.05,
            coefficients = coefficient,
            fit = data.frame(
              target = c("G", "G"),
              condition = c("A", "B"),
              fit_status = c("ok", "ok"),
              rsq = c(0.8, 0.01),
              design_rank_deficient = c(TRUE, TRUE),
              stringsAsFactors = FALSE
            )
          ), class = c("ConditionGRNFit", "list"))
          gated <- .rc_apply_condition_penalty_gate(fit)
          stopifnot(
            identical(gated$coefficients$fit_status, c("ok", "ok")),
            identical(as.numeric(gated$coefficients$penalty_effect), c(0.8, 0.8)),
            identical(as.logical(gated$coefficients$penalty_eligible),
                      c(TRUE, TRUE)),
            identical(as.logical(gated$coefficients$target_model_supported),
                      c(TRUE, FALSE)),
            identical(as.numeric(gated$coefficients$target_rsq), c(0.8, 0.01)),
            identical(
              gated$regcompass_rank_deficient_policy,
              paste(
                "non-identifiable condition contrast is exact-shared and flagged;",
                "continuous condition coefficient remains on the fixed dictionary"
              )
            ),
            identical(
              gated$regcompass_significance_role,
              "BH_and_target_R2_are_diagnostics_only;no_edge_reselection"
            ),
            identical(
              gated$regcompass_target_rsq_definition,
              "scheme_e_z025_full_data_R2_diagnostic"
            )
          )
