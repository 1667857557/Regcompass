name: Rank-deficient penalty contract

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Verify regularized rank deficiency remains diagnostic
        shell: Rscript {0}
        run: |
          .rc_standard_pando_padj_fixed <- 0.05
          .rc_require_pando_condition_grn_fit <- function(x) invisible(TRUE)
          source("R/condition_penalty_contract.R")

          # In multi-task ridge v2, a raw singular design is not represented by
          # fit_status='rank_deficient'. If the penalized solve succeeds the
          # target status is 'ok' and design_rank_deficient remains diagnostic.
          coefficient <- data.frame(
            estimate = c(1, 1, 1, 1),
            estimable = c(TRUE, TRUE, FALSE, TRUE),
            fit_status = c("ok", "ok", "ok", "failed"),
            design_rank_deficient = c(FALSE, TRUE, TRUE, FALSE),
            stringsAsFactors = FALSE
          )
          stopifnot(identical(
            .rc_condition_penalty_gate(coefficient),
            c(TRUE, TRUE, FALSE, FALSE)
          ))

          coefficient <- data.frame(
            target = c("G", "G"),
            condition = c("A", "B"),
            estimate = c(0.8, -0.7),
            estimable = c(TRUE, FALSE),
            significant = c(TRUE, FALSE),
            stringsAsFactors = FALSE
          )
          fit <- list(
            coefficients = coefficient,
            fit = data.frame(
              target = c("G", "G"),
              condition = c("A", "B"),
              fit_status = c("ok", "ok"),
              design_rank_deficient = c(TRUE, TRUE),
              stringsAsFactors = FALSE
            )
          )
          gated <- .rc_apply_condition_penalty_gate(fit)
          stopifnot(
            identical(gated$coefficients$fit_status, c("ok", "ok")),
            identical(as.numeric(gated$coefficients$penalty_effect), c(0.8, 0)),
            identical(
              gated$regcompass_rank_deficient_policy,
              "regularized_ok_fit_retained; condition-zero-variance edge excluded"
            ),
            identical(gated$regcompass_significance_role, "diagnostic_only")
          )
