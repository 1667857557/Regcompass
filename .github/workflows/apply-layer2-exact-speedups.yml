name: Apply exact Layer 2 speedups

on:
  push:
    branches:
      - agent/layer2-target-parallel-exact-speedups
    paths:
      - '.github/workflows/apply-layer2-exact-speedups.yml'

concurrency:
  group: layer2-exact-speedups-export
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export-validated-sources:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/layer2-target-parallel-exact-speedups
          fetch-depth: 0

      - name: Make HiGHS cache source-test safe
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/apply_layer2_exact_speedups.py')
          text = p.read_text()
          start = text.index("replace_function(solver_path, '.rc_microcompass_highs_call'")
          end = text.index("\n\ninsert_before(", start)
          replacement = """replace_function(solver_path, '.rc_microcompass_highs_call', r'''.rc_microcompass_highs_call <- function(name, ...) {
            fun <- get0(
              name, envir = .rc_microcompass_highs_api_cache,
              mode = \"function\", inherits = FALSE
            )
            if (!is.function(fun)) {
              fun <- getExportedValue(\"highs\", name)
              assign(name, fun, envir = .rc_microcompass_highs_api_cache)
            }
            fun(...)
          }''')"""
          p.write_text(text[:start] + replacement + text[end:])

      - name: Apply previously validated source optimizations
        run: python tools/apply_layer2_exact_speedups.py

      - name: Apply validated objective-only test expectation
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/layer2-native-acceleration-check.R')
          text = p.read_text()
          old = 'metrics$n_solves == length(penalty_sets),'
          new = 'metrics$n_solves == length(penalty_sets) + 1L,'
          if text.count(old) != 1:
              raise SystemExit(f'expected one standalone solve-count assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))

      - name: Stage validated source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validated/R validated/tests/testthat validated/.github/workflows
          cp DESCRIPTION validated/DESCRIPTION
          cp R/microcompass_vmax_cache.R validated/R/
          cp R/microcompass_engine.R validated/R/
          cp R/celltype_microcompass_reaction_parallel.R validated/R/
          cp tests/layer2-native-acceleration-check.R validated/tests/
          cp tests/testthat/test-layer2-native-acceleration.R validated/tests/testthat/
          cp .github/workflows/full-gem-step2-checks.yaml validated/.github/workflows/

      - uses: actions/upload-artifact@v4
        with:
          name: layer2-validated-sources
          path: validated
          if-no-files-found: error
          retention-days: 1
