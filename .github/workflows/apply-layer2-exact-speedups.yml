name: Apply exact Layer 2 speedups

on:
  push:
    branches:
      - agent/layer2-target-parallel-exact-speedups
    paths:
      - '.github/workflows/apply-layer2-exact-speedups.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/layer2-target-parallel-exact-speedups
          fetch-depth: 0
          persist-credentials: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install numerical regression dependencies
        shell: Rscript {0}
        run: install.packages(c('Rcpp', 'RcppEigen', 'Matrix', 'highs'))

      - name: Make HiGHS cache source-test safe
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/apply_layer2_exact_speedups.py')
          text = p.read_text()
          start = text.index("replace_function(solver_path, '.rc_microcompass_highs_call'")
          end = text.index("\n\ninsert_before(", start)
          replacement = """replace_function(solver_path, '.rc_microcompass_highs_call', r'''.rc_microcompass_highs_call <- function(name, ...) {
            fun <- get0(
              name, envir = .rc_microcompass_highs_api_cache,
              mode = \"function\", inherits = FALSE
            )
            if (!is.function(fun)) {
              fun <- getExportedValue(\"highs\", name)
              assign(name, fun, envir = .rc_microcompass_highs_api_cache)
            }
            fun(...)
          }''')"""
          p.write_text(text[:start] + replacement + text[end:])

      - name: Apply source-level optimizations
        run: python tools/apply_layer2_exact_speedups.py

      - name: Correct objective-only solve-count regression expectation
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/layer2-native-acceleration-check.R')
          text = p.read_text()
          old = 'metrics$n_solves == length(penalty_sets),'
          new = 'metrics$n_solves == length(penalty_sets) + 1L,'
          if text.count(old) != 1:
              raise SystemExit(f'expected one standalone solve-count assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))

      - name: Parse changed R sources
        shell: Rscript {0}
        run: |
          parse(file='R/microcompass_vmax_cache.R')
          parse(file='R/microcompass_engine.R')
          parse(file='R/celltype_microcompass_reaction_parallel.R')
          parse(file='tests/layer2-native-acceleration-check.R')
          parse(file='tests/testthat/test-layer2-native-acceleration.R')

      - name: Run native/persistent numerical regression
        run: Rscript tests/layer2-native-acceleration-check.R

      - name: Run full-GEM target checkpoint numerical regression
        run: Rscript tests/full-gem-step2-reaction-checkpoint-check.R

      - name: Commit validated sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_layer2_exact_speedups.py tools/fix_layer2_patcher.py .github/workflows/apply-layer2-exact-speedups.yml
          git config user.name 'regcompass-layer2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Accelerate exact target-parallel Layer 2 scoring'
          git push origin HEAD:agent/layer2-target-parallel-exact-speedups
