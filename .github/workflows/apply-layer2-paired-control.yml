name: Validate exact paired Layer 2 optimization

on:
  push:
    branches:
      - agent/layer2-paired-control-exact

permissions:
  contents: write

concurrency:
  group: layer2-paired-control-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true
      - name: Install minimal numerical dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("Matrix", "highs", "RcppEigen"))
      - name: Apply exact paired-control optimization
        run: python tools/optimize_layer2_paired_exact.py
      - name: Parse changed R sources
        shell: Rscript {0}
        run: |
          files <- c(
            "R/microcompass_vmax_cache.R",
            "R/microcompass_engine.R",
            "R/celltype_microcompass_reaction_parallel.R",
            "R/step_layer2.R"
          )
          invisible(lapply(files, parse))
          cat("parse ok\n")
      - name: Paired exact-equivalence regression
        run: Rscript tests/layer2-paired-control-check.R
      - name: Existing native acceleration regression
        run: Rscript tests/layer2-native-acceleration-check.R
      - name: Existing full-GEM checkpoint regression
        run: Rscript tests/full-gem-step2-reaction-checkpoint-check.R
      - name: Commit validated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add R/microcompass_vmax_cache.R R/microcompass_engine.R R/celltype_microcompass_reaction_parallel.R tests/layer2-paired-control-check.R
          git commit -m "Reuse exact RNA-control objectives within target solver" || exit 0
          git push origin HEAD:agent/layer2-paired-control-exact
