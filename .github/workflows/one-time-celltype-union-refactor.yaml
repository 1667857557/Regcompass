name: One-time cell-type union GEM refactor

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Refactor core structural scope
        run: python .github/scripts/refactor_celltype_union_core.py
      - name: Refactor targeted scoring and documentation
        run: python .github/scripts/refactor_celltype_union_targets.py
      - name: Parse all R sources
        shell: Rscript {0}
        run: |
          files <- list.files("R", pattern = "[.]R$", full.names = TRUE)
          for (file in files) {
            tryCatch(
              parse(file = file),
              error = function(e) stop(file, ": ", conditionMessage(e))
            )
          }
      - name: Verify source architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          rdir = Path('R')
          definitions = {}
          pattern = re.compile(
              r'(?m)^([A-Za-z.][A-Za-z0-9._]*)\s*<-\s*function\b'
          )
          for path in sorted(rdir.glob('*.R')):
              for match in pattern.finditer(path.read_text()):
                  definitions.setdefault(match.group(1), []).append(str(path))
          duplicate = {
              name: paths for name, paths in definitions.items()
              if len(paths) > 1
          }
          if duplicate:
              raise RuntimeError(f'Duplicate function definitions: {duplicate}')

          text = '\n'.join(path.read_text() for path in rdir.glob('*.R'))
          forbidden = [
              '.rc_merge_meta_module_catalogue',
              '.rc_build_medium_specific_union_gem_cache',
              '.rc_complete_medium_union_gem',
              '.rc_read_cached_union_gem',
              'one_final_union_gem_per_medium_shared_across_all_units',
              'single_global_fastcore_after_meta_module_merge',
              'shared_across_cell_types = TRUE'
          ]
          found = [value for value in forbidden if value in text]
          if found:
              raise RuntimeError(f'Cross-cell-type structural path remains: {found}')
          required = [
              '.rc_merge_meta_modules_by_cell_type',
              '.rc_build_celltype_medium_union_gem_cache',
              '.rc_complete_celltype_medium_union_gem',
              '.rc_run_celltype_microcompass_engine',
              'shared_across_cell_types = FALSE',
              'celltype_specific_fastcore_after_condition_module_union'
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise RuntimeError(f'Cell-type structural contract is incomplete: {missing}')
          if list(rdir.glob('zzz*.R')):
              raise RuntimeError('Late-loaded zzz source files are forbidden')
      - name: Remove one-time migration files
        run: |
          rm .github/scripts/refactor_celltype_union_core.py
          rm .github/scripts/refactor_celltype_union_targets.py
          rm .github/workflows/one-time-celltype-union-refactor.yaml
          rmdir .github/scripts 2>/dev/null || true
      - name: Commit direct source implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "scope meta-modules union GEMs and FASTCORE by cell type"
          git push origin HEAD:${{ github.head_ref }}
