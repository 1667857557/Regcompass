name: COMPASS medium semantics checks

on:
  pull_request:
    paths:
      - 'DESCRIPTION'
      - 'R/medium.R'
      - 'R/published_medium_contract.R'
      - 'R/compass_medium_semantics.R'
      - 'R/full_gem.R'
      - 'tests/compass-medium-semantics-check.R'
      - 'tests/testthat/test-compass-medium-semantics.R'
      - 'tests/testthat/test-custom-medium-availability.R'
      - '.github/workflows/compass-medium-semantics-checks.yaml'
  push:
    branches: [Main]
    paths:
      - 'DESCRIPTION'
      - 'R/medium.R'
      - 'R/published_medium_contract.R'
      - 'R/compass_medium_semantics.R'
      - 'R/full_gem.R'
      - 'tests/compass-medium-semantics-check.R'
      - 'tests/testthat/test-compass-medium-semantics.R'
      - 'tests/testthat/test-custom-medium-availability.R'
      - '.github/workflows/compass-medium-semantics-checks.yaml'

permissions:
  contents: read

jobs:
  compass-medium:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install regression dependency
        shell: Rscript {0}
        run: install.packages('Matrix')

      - name: Parse medium sources and regression tests
        shell: Rscript {0}
        run: |
          files <- c(
            'R/medium.R',
            'R/published_medium_contract.R',
            'R/compass_medium_semantics.R',
            'R/full_gem.R',
            'tests/compass-medium-semantics-check.R',
            'tests/testthat/test-compass-medium-semantics.R',
            'tests/testthat/test-custom-medium-availability.R'
          )
          for (file in files) parse(file = file)

      - name: Run COMPASS exchange-bound regression
        run: Rscript tests/compass-medium-semantics-check.R

      - name: Audit canonical medium and resolved-cache contract
        shell: python
        run: |
          from pathlib import Path

          description = Path('DESCRIPTION').read_text()
          medium = Path('R/medium.R').read_text()
          semantics = Path('R/compass_medium_semantics.R').read_text()
          full_gem = Path('R/full_gem.R').read_text()
          required = [
              "'published_medium_contract.R'\n    'compass_medium_semantics.R'",
              '.rc_medium_exchange_metabolites <- function',
              'compass_exchange_bounds_v2',
              'compass_uptake_cap_then_explicit_directional_overrides',
              'changed_unlisted_exchange_reactions',
              'rc_apply_medium_constraints <- function',
              '.rc_full_gem_medium_fingerprint <- function',
              '.rc_full_gem_resolved_bounds_identity <- function',
              'resolved_gem_bounds_v1',
              'final_lb = as.numeric(resolved$lb)',
              'final_ub = as.numeric(resolved$ub)',
              'resolved_medium_fingerprint',
          ]
          text = description + '\n' + medium + '\n' + semantics + '\n' + full_gem
          missing = [value for value in required if value not in text]
          if missing:
              raise RuntimeError(f'COMPASS medium contract missing: {missing}')
          forbidden = [
              'rc_apply_medium_constraints <- .rc_apply_compass_medium_constraints',
              '.rc_full_gem_medium_fingerprint <- .rc_compass_medium_fingerprint',
              '.rc_compass_medium_fingerprint <- function',
          ]
          present = [value for value in forbidden if value in text]
          if present:
              raise RuntimeError(f'late-bound/declarative medium contract remains: {present}')
