name: Pando Layer 1 handoff contract

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Verify E-star production and separated-inference handoff
        shell: python
        run: |
          from pathlib import Path
          import re

          description = Path("DESCRIPTION").read_text()
          required_description = [
              "    Pando,",
              "    SuperCell,",
              "1667857557/Pando_regcompass",
              "1667857557/SuperCell_Seurat_V4",
              "Config/RegCompass/PandoConditionModelSchema: pando_condition_grn_Estar_z025_inference_separated_v1",
              "Config/RegCompass/PandoConditionMethod: global-condition-union-Estar-z025-separated-inference",
              "Config/RegCompass/PandoConditionPenalty: information-scaled-sparse-deviation-z025",
              "Config/RegCompass/PandoConditionProjectionPolicy: exact-edge-whole-network-BH-common-topology",
              "Config/RegCompass/PandoConditionInference: condition-local-gaussian-LM-exact-edge-omnibus-whole-network-BH",
              "Config/RegCompass/PandoTargetR2: scheme-E-z025-full-data-R2-diagnostic",
              "Config/RegCompass/PandoTargetPenaltyQ: condition-common-edge-topology-standard-route-legacy-filter",
          ]
          missing = [x for x in required_description if x not in description]
          if missing:
              raise RuntimeError(f"DESCRIPTION cross-package policy missing: {missing}")
          forbidden_description = [
              "pando_condition_grn_Estar_jointse_v1",
              "global-condition-union-Estar-z025-JSE",
              "any-condition-padj-exact-edge-union",
              "fusion-component-joint-refit-condition-target-BH",
              "condition-any-condition-BH-exact-edge-union",
          ]
          present = [x for x in forbidden_description if x in description]
          if present:
              raise RuntimeError(f"obsolete conditional policy remains in DESCRIPTION: {present}")
          for forbidden in (
              "Pando (>=", "SuperCell (>=",
              "1667857557/Pando_regcompass@",
              "1667857557/SuperCell_Seurat_V4@",
          ):
              if forbidden in description:
                  raise RuntimeError(
                      f"cross-package compatibility must not be version-pinned: {forbidden}"
                  )

          route = Path("R/grn_route_parallel.R").read_text()
          required_route = [
              'getNamespaceExports("Pando")',
              '"infer_condition_grn"',
              '"condition_grn_fit"',
              "tf_cor = 0.05",
              "peak_cor = 0.05",
              "padj_threshold in (0, 1)",
              "Removed conditional Pando control(s)",
              "fixed production E-star",
          ]
          missing = [value for value in required_route if value not in route]
          if missing:
              raise RuntimeError(f"Pando API/routing contract missing: {missing}")
          for forbidden in (
              "condition_args$condition_ridge_control",
              "condition_args$scheme_e_z",
              "condition_args$fusion_ratio",
              "fixed production E-star/JSE",
          ):
              if forbidden in route:
                  raise RuntimeError(f"obsolete conditional route remains: {forbidden}")

          condition = Path("R/condition_grn_contract.R").read_text()
          required_condition = [
              '"pando_condition_grn_Estar_z025_inference_separated_v1"',
              '"condition_union_Estar_z025_inference_separated"',
              '"frozen_dictionary_condition_local_gaussian_lm_edge_omnibus_v1"',
              '"exact_edge_whole_network_BH_common_topology"',
              '"exact_edge_whole_cell_type_network_BH"',
              ".RC_PANDO_CONDITION_SCHEME_E_Z <- 0.25",
              '"information_scaled_sparse_deviation"',
              "dictionary_support_table",
              "candidate_tf_cor",
              "candidate_peak_cor",
              "condition_inference_estimable",
              "inference_variance",
              "edge_inference",
              "edge_pval",
              "edge_padj",
              "edge_supported",
              "active_in_regcompass",
              "contrast_identifiable",
              "shared_by_boundary",
              "fused_by_penalty",
              "tf_peak_gene_condition_contrasts",
          ]
          missing = [value for value in required_condition if value not in condition]
          if missing:
              raise RuntimeError(f"separated-inference condition scheduler missing: {missing}")
          forbidden_condition = [
              "pando_condition_grn_Estar_jointse_v1",
              "condition_union_Estar_z025_jointse",
              "scheme_e_fusion_component_joint_refit_v1",
              '"condition_target_BH"',
              '"any_condition_padj_exact_edge_union"',
              "supporting_conditions",
              "edge_union_supported",
          ]
          present = [value for value in forbidden_condition if value in condition]
          if present:
              raise RuntimeError(f"obsolete JSE/union contract remains: {present}")

          helper = Path("R/grn_condition_parallel.R").read_text()
          required_helper = [
              ".rc_condition_ridge_fit_task <- function",
              "Pando::infer_condition_grn",
              "Pando::condition_grn_fit",
              "phase=pando_Estar_z025_separate_inference_pipeline",
              "phase=pando_Estar_z025_separate_inference_complete",
              "condition_inference_estimable_rows=",
              "edge_inference_estimable=",
              "regcompass_edges=",
          ]
          missing = [value for value in required_helper if value not in helper]
          if missing:
              raise RuntimeError(f"separated-inference task helper missing: {missing}")
          for forbidden in (
              "Pando::fit_grn_from_edges",
              ".rc_condition_fit_task",
              "pando_Estar_z025_JSE",
              "condition_significant_rows=",
              "regcompass_union_edges=",
          ):
              if forbidden in helper:
                  raise RuntimeError(f"obsolete condition task remains: {forbidden}")

          penalty = Path("R/condition_penalty_contract.R").read_text()
          required_penalty = [
              ".RC_PANDO_PENALTY_CORR_THRESHOLD <- 0",
              ".RC_PANDO_PENALTY_ESTIMATE_THRESHOLD <- 0",
              ".RC_PANDO_TARGET_RSQ_THRESHOLD <- 0.05",
              ".rc_expected_edge_inference_from_coefficients",
              ".rc_validate_pando_active_condition_edges",
              ".rc_condition_penalty_gate",
              "condition_inference_estimable",
              "condition_pval",
              "inference_variance",
              "edge_inference_estimable",
              "edge_pval",
              "edge_padj",
              "edge_supported",
              "all_conditions_fit_valid",
              "active_in_regcompass",
              "penalty_effect must equal the production E-star coefficient",
              '"exact_edge_whole_cell_type_network_BH"',
          ]
          missing = [value for value in required_penalty if value not in penalty]
          if missing:
              raise RuntimeError(f"separated-inference penalty-entry contract missing: {missing}")
          for forbidden in (
              "condition_significant",
              "edge_union_supported",
              "supporting_conditions",
              "n_supporting_conditions",
          ):
              if forbidden in penalty:
                  raise RuntimeError(f"obsolete condition-union field remains in penalty contract: {forbidden}")

          layer1 = Path("R/step_layer1_parallel_object_contract.R").read_text()
          projection = Path("R/pando_evidence_utils.R").read_text()
          required_layer1 = [
              ".rc_validate_pando_active_condition_edges",
              ".rc_condition_penalty_gate",
              ".rc_validate_pando_fit_metadata_frame <- function",
              "Condition-Pando projection requires exactly one metacell membership",
              '"beta_times_0.75_paired_mean_product_plus_0.25_product_of_means"',
              'origin = "paired_cell_Estar_z025_common_exact_edge_whole_network_BH"',
              'projection_name = "E_star_z025_common_topology_condition_effect"',
              "target_rsq_supported_diagnostic",
              "condition_inference_estimable",
              "edge_supported",
          ]
          missing = [value for value in required_layer1 if value not in layer1]
          if missing:
              raise RuntimeError(f"Layer 1 separated-inference handoff missing: {missing}")
          for forbidden in (
              "paired_cell_Estar_z025_any_condition_BH_exact_edge_union",
              "E_star_z025_union_condition_effect",
              "any-condition",
          ):
              if forbidden in layer1:
                  raise RuntimeError(f"obsolete Layer 1 union wording remains: {forbidden}")
          required_projection = [
              ".RC_PANDO_PROJECTION_PRODUCT_OF_MEANS_WEIGHT <- 0.25",
              ".rc_validate_pando_projection_weight <- function",
              ".rc_pando_projection_from_group_means <- function",
              "paired_product <- tf_block * peak_block",
              "paired_weight * paired_mean",
              "product_of_means_weight * tf_mean * peak_mean",
              "contribution <- estimate * interaction_mean",
          ]
          missing = [value for value in required_projection if value not in projection]
          if missing:
              raise RuntimeError(f"paired-exposure Pando projection missing: {missing}")

          all_r = "\n".join(path.read_text() for path in sorted(Path("R").glob("*.R")))
          forbidden_architecture = [
              "pando_grn_data_by_cell_type_v1",
              ".rc_extract_condition_grn_contract_core",
              ".rc_merge_condition_job_results_core",
              ".rc_merge_pando_results_validated",
              ".rc_merge_pando_results_with_parallel_objects",
              ".rc_fit_condition_grns_regcompass_parallel",
              ".rc_condition_multitask_fit_task",
              "aggregate_condition_grn_projection_strict",
              ".rc_cell_first_projection_layer1_v6",
          ]
          present = [value for value in forbidden_architecture if value in all_r]
          if present:
              raise RuntimeError(f"obsolete versioned/wrapper architecture remains: {present}")

          canonical = {
              "R/condition_grn_contract.R": [
                  ".rc_require_pando_condition_grn_fit",
                  ".rc_extract_condition_grn_contract",
                  ".rc_fit_condition_grns_by_cell_type",
              ],
              "R/grn_condition_parallel.R": [
                  ".rc_condition_parallel_plan",
                  ".rc_condition_prepare_celltype_task",
                  ".rc_condition_ridge_fit_task",
              ],
              "R/grn_parallel_merge_contract.R": [".rc_merge_condition_job_results"],
              "R/pando_evidence_utils.R": [".rc_pando_projection_from_group_means"],
              "R/supercell_quantitative_rna.R": [".rc_cell_first_projection_layer1"],
              "R/mixed_pando.R": [
                  ".rc_active_target_penalty_q",
                  ".rc_penalty_evaluated_rows",
              ],
          }
          for path, names in canonical.items():
              for name in names:
                  count = len(re.findall(
                      rf"(?m)^{re.escape(name)}\s*<-\s*function\b", all_r
                  ))
                  if count != 1:
                      raise RuntimeError(
                          f"{name} must have exactly one package definition; found {count}"
                      )

      - name: Parse handoff sources
        shell: Rscript {0}
        run: |
          files <- c(
            "R/condition_grn_contract.R",
            "R/mixed_pando.R",
            "R/mixed_pando_contract.R",
            "R/grn_condition_parallel.R",
            "R/grn_route_parallel.R",
            "R/grn_parallel_merge_contract.R",
            "R/condition_penalty_contract.R",
            "R/pando_evidence_utils.R",
            "R/step_layer1_parallel_object_contract.R",
            "R/supercell_quantitative_rna.R",
            "R/step_grn_common_dictionary.R"
          )
          for (file in files) parse(file = file)
