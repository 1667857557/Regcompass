name: Pando Layer 1 handoff contract

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Verify canonical projection handoff
        shell: python
        run: |
          from pathlib import Path
          import re

          description = Path("DESCRIPTION").read_text()
          if "Pando (>= " in description or "Pando (>=" in description:
              raise RuntimeError("Pando compatibility must not use a version floor")
          required_description = [
              "Config/RegCompass/PandoConditionModelSchema: pando_condition_grn_multitask_ridge_v3",
              "Config/RegCompass/PandoConditionProjectionPolicy: active-global-or-local-support-and-condition-BH-ridge",
              "Config/RegCompass/PandoConditionMethod: global-condition-union-single-no-fusion-ridge",
          ]
          missing = [x for x in required_description if x not in description]
          if missing:
              raise RuntimeError(f"DESCRIPTION condition policy missing: {missing}")

          route = Path("R/grn_route_parallel.R").read_text()
          required_route = [
              'getNamespaceExports("Pando")',
              '"infer_condition_grn"',
              '"condition_grn_fit"',
              '"condition_ridge_control"',
              "tf_cor = 0.05",
              "peak_cor = 0.05",
              "padj_threshold in (0, 1)",
              "fusion_ratio",
              "obsolete",
          ]
          missing = [value for value in required_route if value not in route]
          if missing:
              raise RuntimeError(f"Pando API preflight missing: {missing}")
          if "package_version" in route or "packageVersion" in route:
              raise RuntimeError("Pando API preflight still contains a version gate")

          condition = Path("R/condition_grn_contract.R").read_text()
          required_condition = [
              ".rc_fit_condition_grns_by_cell_type",
              "dictionary_support_table",
              "candidate_tf_cor",
              "candidate_peak_cor",
              "global/local candidate support",
              "Every condition must contain every common-dictionary edge exactly once",
              "tf_peak_gene_condition_contrasts",
              "same_global_condition_union_dictionary_no_fusion_ridge_raw_units",
              "tf_cor = 0.05, peak_cor = 0.05",
              "tf_cor/peak_cor in [0, 1]",
          ]
          missing = [value for value in required_condition if value not in condition]
          if missing:
              raise RuntimeError(f"condition-GRN scheduler missing: {missing}")
          forbidden_condition = [
              "preliminary joint ridge BH screening",
              "significant-edge union",
              "preliminary_joint_ridge_bh_significant_union_then_joint_refit",
              "two_stage_exact_edge_union_multitask_ridge",
          ]
          present = [value for value in forbidden_condition if value in condition]
          if present:
              raise RuntimeError(f"obsolete two-stage condition implementation remains: {present}")

          helper = Path("R/grn_condition_parallel.R").read_text()
          required_helper = [
              ".rc_condition_ridge_fit_task <- function",
              "Pando::infer_condition_grn",
              "Pando::condition_grn_fit",
              "condition_ridge_control",
              "fusion_ratio",
              'parallel_scope = "target"',
              "active_edges=",
          ]
          missing = [value for value in required_helper if value not in helper]
          if missing:
              raise RuntimeError(f"condition task helper contract missing: {missing}")
          for forbidden in ("Pando::fit_grn_from_edges", ".rc_condition_fit_task"):
              if forbidden in helper:
                  raise RuntimeError(f"obsolete independent condition fit remains: {forbidden}")

          penalty = Path("R/condition_penalty_contract.R").read_text()
          required_penalty = [
              ".RC_PANDO_PENALTY_CORR_THRESHOLD <- 0",
              ".RC_PANDO_PENALTY_ESTIMATE_THRESHOLD <- 0",
              ".rc_validate_pando_active_condition_edges",
              "statistically_supported",
              "global_support",
              "local_support",
              "expected_active",
              'fit_status == "ok"',
              "consume_pando_active_condition_edge_without_reselection",
          ]
          missing = [value for value in required_penalty if value not in penalty]
          if missing:
              raise RuntimeError(f"active ridge penalty-entry contract missing: {missing}")

          layer1 = Path("R/step_layer1_parallel_object_contract.R").read_text()
          projection = Path("R/pando_evidence_utils.R").read_text()
          required_layer1 = [
              ".rc_validate_pando_active_condition_edges",
              ".rc_condition_penalty_gate",
              ".rc_validate_pando_fit_metadata_frame <- function",
              "Condition-Pando projection requires exactly one metacell membership",
              'aggregation_contract =',
              '"beta_times_group_mean_tf_times_group_mean_atac"',
              'origin = "paired_cell_global_or_local_candidate_no_fusion_ridge_active_edges"',
              'projection_name = "active_no_fusion_ridge_condition_effect"',
              "unique cell-type set.",
          ]
          missing = [value for value in required_layer1 if value not in layer1]
          if missing:
              raise RuntimeError(f"Layer 1 canonical handoff missing: {missing}")
          required_projection = [
              ".rc_pando_projection_from_group_means <- function",
              "tf_mean <- if",
              "peak_mean <- if",
              "Matrix::colMeans(tf_block)",
              "base::colMeans(tf_block)",
              "Matrix::colMeans(peak_block)",
              "base::colMeans(peak_block)",
              "contribution <- estimate * tf_mean * peak_mean",
          ]
          missing = [value for value in required_projection if value not in projection]
          if missing:
              raise RuntimeError(f"sparse-safe product-of-means Pando projection missing: {missing}")

          merge = Path("R/grn_parallel_merge_contract.R").read_text()
          required_merge = [
              ".rc_merge_condition_job_results <- function",
              "pando_grn_data_by_cell_type",
              "preserves_cell_type_peak_space",
              "tf_peak_gene_condition_contrasts",
          ]
          missing = [value for value in required_merge if value not in merge]
          if missing:
              raise RuntimeError(f"condition result merge missing: {missing}")

          all_r = "\n".join(
              path.read_text() for path in sorted(Path("R").glob("*.R"))
          )
          forbidden_architecture = [
              "pando_grn_data_by_cell_type_v1",
              ".rc_extract_condition_grn_contract_core",
              ".rc_merge_condition_job_results_core",
              ".rc_merge_pando_results_validated",
              ".rc_merge_pando_results_with_parallel_objects",
              ".rc_fit_condition_grns_regcompass_parallel",
              ".rc_condition_multitask_fit_task",
              "aggregate_condition_grn_projection_strict",
          ]
          present = [value for value in forbidden_architecture if value in all_r]
          if present:
              raise RuntimeError(f"obsolete versioned/wrapper architecture remains: {present}")

          canonical = {
              "R/condition_grn_contract.R": [
                  ".rc_require_pando_condition_grn_fit",
                  ".rc_extract_condition_grn_contract",
                  ".rc_fit_condition_grns_by_cell_type",
              ],
              "R/grn_condition_parallel.R": [
                  ".rc_condition_parallel_plan",
                  ".rc_condition_prepare_celltype_task",
                  ".rc_condition_ridge_fit_task",
              ],
              "R/grn_parallel_merge_contract.R": [
                  ".rc_merge_condition_job_results",
              ],
              "R/pando_evidence_utils.R": [
                  ".rc_pando_projection_from_group_means",
              ],
          }
          for path, names in canonical.items():
              for name in names:
                  count = len(re.findall(
                      rf"(?m)^{re.escape(name)}\s*<-\s*function\b", all_r
                  ))
                  if count != 1:
                      raise RuntimeError(
                          f"{name} must have exactly one package definition; found {count}"
                      )
      - name: Parse handoff sources
        shell: Rscript {0}
        run: |
          files <- c(
            "R/condition_grn_contract.R",
            "R/mixed_pando.R",
            "R/mixed_pando_contract.R",
            "R/grn_condition_parallel.R",
            "R/grn_route_parallel.R",
            "R/grn_parallel_merge_contract.R",
            "R/condition_penalty_contract.R",
            "R/pando_evidence_utils.R",
            "R/step_layer1_parallel_object_contract.R"
          )
          for (file in files) parse(file = file)
