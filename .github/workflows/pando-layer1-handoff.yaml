name: Pando Layer 1 handoff contract

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Verify canonical projection handoff
        shell: python
        run: |
          from pathlib import Path
          import re

          description = Path("DESCRIPTION").read_text()
          if "Pando (>= " in description or "Pando (>=" in description:
              raise RuntimeError("Pando compatibility must not use a version floor")
          required_description = [
              "Config/RegCompass/PandoConditionProjectionPolicy: screen-bh-supported-refit-ridge-effects",
              "Config/RegCompass/PandoConditionMethod: screened-union-multitask-ridge-effect-refit",
              "Config/RegCompass/PandoConditionInference: preliminary-ridge-Wald-BH-screen-only-final-refit-no-inference",
          ]
          missing = [x for x in required_description if x not in description]
          if missing:
              raise RuntimeError(f"DESCRIPTION condition policy missing: {missing}")

          route = Path("R/grn_route_parallel.R").read_text()
          required_route = [
              'getNamespaceExports("Pando")',
              '"infer_condition_grn"',
              '"condition_grn_fit"',
              '"condition_ridge_control"',
              "padj_threshold in (0, 1)",
              "Unsupported override(s)",
          ]
          missing = [x for x in required_route if x not in route]
          if missing:
              raise RuntimeError(f"Pando API preflight missing: {missing}")
          if "package_version" in route or "packageVersion" in route:
              raise RuntimeError("Pando API preflight still contains a version gate")

          condition = Path("R/condition_grn_contract.R").read_text()
          required_condition = [
              ".RC_PANDO_CONDITION_GRN_ENGINE <-",
              '"screened_dictionary_multitask_ridge_effect_refit"',
              ".RC_PANDO_CONDITION_PROJECTION_POLICY <-",
              '"screen_bh_supported_refit_ridge_effects"',
              ".RC_PANDO_CONDITION_DICTIONARY_POLICY <-",
              '"preliminary_joint_ridge_bh_supported_union_then_effect_only_joint_refit"',
              ".rc_fit_condition_grns_by_cell_type",
              "tf_peak_gene_condition_contrasts",
              "screening_n_significant_conditions",
              "post_screen_joint_ridge_effect_estimation_only_no_final_inference",
          ]
          missing = [x for x in required_condition if x not in condition]
          if missing:
              raise RuntimeError(f"condition-GRN contract missing: {missing}")
          forbidden_condition = [
              "two_stage_exact_edge_union_fixed_dictionary_glm",
              "same_exact_edge_dictionary_unscaled_gaussian_glm",
              "same_significant_union_dictionary_joint_multitask_ridge_raw_units",
          ]
          present = [x for x in forbidden_condition if x in condition]
          if present:
              raise RuntimeError(f"obsolete condition implementation remains: {present}")

          helper = Path("R/grn_condition_parallel.R").read_text()
          required_helper = [
              ".rc_condition_multitask_fit_task <- function",
              "Pando::infer_condition_grn",
              "Pando::condition_grn_fit",
              "condition_ridge_control",
              'parallel_scope = "target"',
          ]
          missing = [x for x in required_helper if x not in helper]
          if missing:
              raise RuntimeError(f"condition task helper contract missing: {missing}")
          for forbidden in ("Pando::fit_grn_from_edges", ".rc_condition_fit_task"):
              if forbidden in helper:
                  raise RuntimeError(f"obsolete independent condition fit remains: {forbidden}")

          penalty = Path("R/condition_penalty_contract.R").read_text()
          required_penalty = [
              ".RC_PANDO_PENALTY_CORR_THRESHOLD <- 0",
              ".RC_PANDO_PENALTY_ESTIMATE_THRESHOLD <- 0",
              "coefficient$screen_significant %in% TRUE",
              "coefficient$estimable %in% TRUE",
              "is.finite(estimate)",
              "is.finite(screen_padj)",
              "screen_padj < threshold",
              'fit_status == "ok"',
              '"stage1_dictionary_screen_support_gate_on_final_refit_effect"',
          ]
          missing = [x for x in required_penalty if x not in penalty]
          if missing:
              raise RuntimeError(f"screen-supported ridge penalty contract missing: {missing}")
          if "condition_edge_inclusion_gate" in penalty:
              raise RuntimeError("obsolete final-BH penalty gate remains")

          layer1 = Path("R/step_layer1_parallel_object_contract.R").read_text()
          required_layer1 = [
              ".rc_condition_penalty_gate",
              ".rc_validate_pando_fit_metadata_frame <- function",
              '"beta_times_group_mean_tf_times_group_mean_atac"',
              'origin = "paired_cell_screened_dictionary_multitask_ridge_refit"',
              'projection_name = "screen_supported_final_refit_multitask_ridge_condition_effect"',
          ]
          missing = [x for x in required_layer1 if x not in layer1]
          if missing:
              raise RuntimeError(f"Layer 1 canonical handoff missing: {missing}")

          projection = Path("R/pando_evidence_utils.R").read_text()
          required_projection = [
              ".rc_pando_projection_from_group_means <- function",
              "Matrix::colMeans(tf_block)",
              "Matrix::colMeans(peak_block)",
              "contribution <- estimate * tf_mean * peak_mean",
          ]
          missing = [x for x in required_projection if x not in projection]
          if missing:
              raise RuntimeError(f"product-of-means projection missing: {missing}")

          all_r = "\n".join(
              path.read_text() for path in sorted(Path("R").glob("*.R"))
          )
          canonical = {
              ".rc_require_pando_condition_grn_fit": "R/condition_grn_contract.R",
              ".rc_extract_condition_grn_contract": "R/condition_grn_contract.R",
              ".rc_fit_condition_grns_by_cell_type": "R/condition_grn_contract.R",
              ".rc_condition_multitask_fit_task": "R/grn_condition_parallel.R",
              ".rc_merge_condition_job_results": "R/grn_parallel_merge_contract.R",
              ".rc_pando_projection_from_group_means": "R/pando_evidence_utils.R",
          }
          for name, path in canonical.items():
              pattern = rf"(?m)^{re.escape(name)}\s*<-\s*function\b"
              if len(re.findall(pattern, all_r)) != 1:
                  raise RuntimeError(f"{name} must have exactly one package definition")
              if not re.search(pattern, Path(path).read_text()):
                  raise RuntimeError(f"{name} is not defined in {path}")

      - name: Parse handoff sources
        shell: Rscript {0}
        run: |
          files <- c(
            "R/condition_grn_contract.R",
            "R/mixed_pando.R",
            "R/mixed_pando_contract.R",
            "R/grn_condition_parallel.R",
            "R/grn_route_parallel.R",
            "R/grn_parallel_merge_contract.R",
            "R/condition_penalty_contract.R",
            "R/pando_evidence_utils.R",
            "R/step_layer1_parallel_object_contract.R"
          )
          for (file in files) parse(file = file)
