name: Pando Layer 1 handoff contract

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Verify strict projection handoff
        shell: python
        run: |
          from pathlib import Path
          description = Path("DESCRIPTION").read_text()
          if "Pando (>= " in description or "Pando (>=" in description:
              raise RuntimeError("Pando compatibility must not use a version floor")
          bridge = Path("R/grn_integration_contract.R").read_text()
          required_bridge = [
              "getNamespaceExports(\"Pando\")",
              "aggregate_condition_grn_projection_strict",
              "required API contract",
          ]
          missing = [value for value in required_bridge if value not in bridge]
          if missing:
              raise RuntimeError(f"Pando API preflight missing: {missing}")
          if "package_version" in bridge or "packageVersion" in bridge:
              raise RuntimeError("Pando API preflight still contains a version gate")
          penalty = Path("R/condition_penalty_contract.R").read_text()
          required_penalty = [
              ".RC_PANDO_PENALTY_CORR_THRESHOLD <- 0.05",
              ".RC_PANDO_PENALTY_ESTIMATE_THRESHOLD <- 0.05",
              "abs(corr) >= .RC_PANDO_PENALTY_CORR_THRESHOLD",
              "abs(estimate) >= .RC_PANDO_PENALTY_ESTIMATE_THRESHOLD",
          ]
          missing = [value for value in required_penalty if value not in penalty]
          if missing:
              raise RuntimeError(f"penalty-entry contract missing: {missing}")
          layer1 = Path("R/step_layer1_parallel_object_contract.R").read_text()
          required = [
              "Pando::aggregate_condition_grn_projection_strict",
              ".rc_validate_pando_fit_metadata_frame",
              "aggregation_contract = \"all_projected_cells_have_exact_membership\"",
              "unique cell-type set.",
          ]
          missing = [value for value in required if value not in layer1]
          if missing:
              raise RuntimeError(f"Layer 1 strict handoff missing: {missing}")
          parallel = Path("R/grn_parallel_merge_contract.R").read_text()
          required_parallel = [
              ".rc_validate_pando_result_cell_partition",
              ".rc_validate_condition_job_merge_output",
          ]
          missing = [value for value in required_parallel if value not in parallel]
          if missing:
              raise RuntimeError(f"parallel handoff validation missing: {missing}")
      - name: Parse handoff sources
        shell: Rscript {0}
        run: |
          files <- c(
            "R/condition_grn_contract_compat.R",
            "R/mixed_pando_contract.R",
            "R/grn_parallel_merge_contract.R",
            "R/grn_integration_contract.R",
            "R/condition_penalty_contract.R",
            "R/step_layer1_parallel_object_contract.R"
          )
          for (file in files) parse(file = file)
