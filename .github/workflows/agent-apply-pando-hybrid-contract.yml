name: Apply Pando hybrid ABI 5 contract

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/require-pando-hybrid-abi5
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Apply canonical integration changes
        run: |
          base64 --decode .agent-patch/apply_pando_hybrid_contract.py.gz.b64 | gzip -d > /tmp/apply_pando_hybrid_contract.py
          python /tmp/apply_pando_hybrid_contract.py
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::remotes
          dependencies: '"hard"'
      - name: Install validated Pando feature branch
        shell: Rscript {0}
        run: |
          remotes::install_github(
            "1667857557/Pando_regcompass@agent/hybrid-condition-target-engine",
            dependencies = TRUE,
            upgrade = "never"
          )
          stopifnot(as.character(packageVersion("Pando")) == "1.6.1")
      - name: Install RegCompass and run integration contract tests
        run: R CMD INSTALL . --no-multiarch --with-keep.source
      - name: Verify source and installed native ABI
        shell: Rscript {0}
        run: |
          library(RegCompassR)
          library(Pando)
          library(testthat)
          test_file("tests/testthat/test-pando-native-refit-contract.R")
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require Pando hybrid condition target engine"
          git push origin HEAD:agent/require-pando-hybrid-abi5
