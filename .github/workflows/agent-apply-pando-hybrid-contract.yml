name: Apply Pando hybrid ABI 5 contract

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Apply canonical integration and progress changes
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path(
              ".agent-patch/apply_pando_hybrid_contract.py.gz.b64"
          ).read_bytes()
          encoded = encoded.removeprefix(b"\xef\xbb\xbf")
          encoded = b"".join(encoded.split())
          compressed = base64.b64decode(encoded, validate=True)
          Path("/tmp/apply_pando_hybrid_contract.py").write_bytes(
              gzip.decompress(compressed)
          )
          PY
          python /tmp/apply_pando_hybrid_contract.py
          python .agent-patch/apply_detailed_progress.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/testthat/test-detailed-stage-progress.R")
          text = path.read_text()
          text = text.replace(
              'expect_match(bridge_text, "phase = \\\\"nested_cv\\\\"")',
              'expect_match(bridge_text, \'phase = "nested_cv"\', fixed = TRUE)'
          )
          path.write_text(text)
          PY
      - name: Parse modified R sources and tests
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          invisible(lapply(files, parse))
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::remotes
          dependencies: '"hard"'
      - name: Install validated Pando hybrid branch
        shell: Rscript {0}
        run: |
          remotes::install_github(
            "1667857557/Pando_regcompass@agent/finalize-hybrid-engine-source",
            dependencies = TRUE,
            upgrade = "never"
          )
          stopifnot(as.character(packageVersion("Pando")) == "1.6.1")
          description <- utils::packageDescription("Pando")
          stopifnot(
            identical(description[["Config/Pando/NativeSparseABI"]], "5"),
            identical(
              description[["Config/Pando/ConditionInnerCVBackend"]],
              "cpp-eigen-hybrid-gram-sufficient-statistics-fail-fast"
            )
          )
      - name: Install RegCompass
        run: R CMD INSTALL . --no-multiarch --with-keep.source
      - name: Verify native ABI and detailed progress
        shell: Rscript {0}
        run: |
          library(RegCompassR)
          library(Pando)
          library(testthat)
          test_file("tests/testthat/test-pando-native-refit-contract.R")
          test_file("tests/testthat/test-detailed-stage-progress.R")
      - name: Verify source contract
        run: |
          set -euo pipefail
          grep -Fq 'Config/RegCompass/PandoNativeSparseABI: 5' DESCRIPTION
          grep -Fq 'cpp-eigen-hybrid-gram-sufficient-statistics-fail-fast' DESCRIPTION
          grep -Fq 'step_progress.tsv' R/execution_monitor.R
          grep -Fq 'phase = "nested_cv"' R/condition_grn_contract.R
          grep -Fq 'call_args$progress_monitor <- monitor' R/stepwise_workflow.R
      - name: Commit validated canonical implementation
        run: |
          set -euo pipefail
          git checkout HEAD -- .agent-patch .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No canonical changes produced"; exit 1; }
          git commit -m "Require Pando hybrid engine and add detailed progress"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
