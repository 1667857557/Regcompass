          active_check = []
          for path in dict.fromkeys(active_files):
              if path.exists():
                  text = path.read_text(encoding='utf-8')
                  for match in re.finditer(r'\bgamma\s*(?:=|<-)\s*(?:75|100)L?\b', text):
                      active_check.append(f'{path}:{match.group(0)}')
          if active_check:
              raise RuntimeError('Old gamma defaults remain:\n' + '\n'.join(active_check))

          required_stage_calls = [
              'rc_regcompass_step_grn(',
              'rc_regcompass_step_metacells(',
              'rc_regcompass_step_meta_modules(',
              'rc_regcompass_step_layer1(',
              'rc_regcompass_step_layer2(',
              'rc_regcompass_step_results('
          ]
          stepwise = read('docs/tutorial-02-stepwise-audit.md')
          missing = [x for x in required_stage_calls if x not in stepwise]
          if missing or 'rc_run_regcompass_one_shot(' in stepwise:
              raise RuntimeError(f'Invalid stepwise tutorial; missing={missing}')
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Restore true stepwise tutorials and gamma 30 [skip tutorial patch]"
          git push origin HEAD:agent/restore-stepwise-tutorials-gamma30
