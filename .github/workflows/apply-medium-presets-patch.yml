name: Apply medium preset implementation patch

on:
  push:
    branches:
      - agent/medium-species-literature-provenance

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified patch
        run: |
          git apply --check .github/scripts/medium-presets.patch
          git apply .github/scripts/medium-presets.patch

      - uses: r-lib/actions/setup-r@v2

      - name: Parse changed R code
        run: Rscript -e "parse(file = 'R/medium.R')"

      - name: Verify provenance markers
        run: |
          grep -q 'hplm_concentrations' R/medium.R
          grep -q 'Human-derived medium presets cannot be used with a Mouse-GEM run' R/medium.R
          grep -q '10.1186/s13578-015-0030-1' R/medium.R

      - name: Commit implementation and remove temporary automation
        run: |
          rm .github/scripts/medium-presets.patch
          rm .github/workflows/apply-medium-presets-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement literature-backed medium species policy"
          git push origin HEAD:agent/medium-species-literature-provenance
