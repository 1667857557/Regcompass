name: Layer 2 progress reporting checks

on:
  pull_request:
    paths:
      - 'R/execution_monitor.R'
      - 'R/step_layer2.R'
      - 'R/celltype_union_gem_cache.R'
      - 'R/celltype_microcompass_reaction_parallel.R'
      - 'R/layer2_corda_runtime_cache.R'
      - 'R/layer2_corda_pool_lifecycle.R'
      - 'tests/layer2-progress-reporting-check.R'
      - '.github/workflows/layer2-progress-reporting-checks.yaml'
  push:
    branches: [Main]
    paths:
      - 'R/execution_monitor.R'
      - 'R/step_layer2.R'
      - 'R/celltype_union_gem_cache.R'
      - 'R/celltype_microcompass_reaction_parallel.R'
      - 'R/layer2_corda_runtime_cache.R'
      - 'R/layer2_corda_pool_lifecycle.R'
      - 'tests/layer2-progress-reporting-check.R'
      - '.github/workflows/layer2-progress-reporting-checks.yaml'

permissions:
  contents: read

jobs:
  layer2-progress:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Parse progress sources and regression
        shell: Rscript {0}
        run: |
          files <- c(
            'R/execution_monitor.R',
            'R/step_layer2.R',
            'R/celltype_union_gem_cache.R',
            'R/celltype_microcompass_reaction_parallel.R',
            'R/layer2_corda_runtime_cache.R',
            'R/layer2_corda_pool_lifecycle.R',
            'tests/layer2-progress-reporting-check.R'
          )
          for (file in files) parse(file = file)

      - name: Run hierarchical progress regression
        run: Rscript tests/layer2-progress-reporting-check.R

      - name: Audit overall and task-level contracts
        shell: python
        run: |
          from pathlib import Path

          text = Path('R/layer2_corda_pool_lifecycle.R').read_text()
          required = [
              '.rc_layer2_progress_parts <- 12L',
              'layer2_task_progress.tsv',
              'layer2_task_status.tsv',
              'cell_type=%s | medium=%s | route=%s',
              'fastcore_support_completion',
              'corda2_step1_HC_dependencies',
              'corda2_step2_1_MC_NC_dependencies',
              'corda2_step2_2_MC_feasibility',
              'corda2_step3_HC_OT_dependencies',
              'directional_vmax_start',
              'penalty_step2_complete',
              'rna_control_complete',
              'layer2_validation_complete',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise RuntimeError(f'Layer 2 progress contract missing: {missing}')
