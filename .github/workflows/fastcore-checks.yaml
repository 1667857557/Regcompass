name: RegCompassR source check

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Validate cross-package source contract
        shell: python
        run: |
          from pathlib import Path

          description = Path("DESCRIPTION").read_text()
          required_description = [
              "Version: 2.4.5",
              "'condition_grn_contract_compat.R'",
              "'mixed_pando_contract.R'",
              "'grn_parallel_merge_contract.R'",
              "'grn_integration_contract.R'",
              "'condition_penalty_contract.R'",
              "'layer2_parallel_runtime.R'",
              "'celltype_microcompass_reaction_parallel.R'",
              "'layer2_corda_paper_contract.R'",
              "'layer2_corda2_algorithm.R'",
              "'layer2_corda_model.R'",
          ]
          missing = [x for x in required_description if x not in description]
          if missing:
              raise RuntimeError(f"DESCRIPTION integration contract missing: {missing}")
          if "Pando (>=" in description:
              raise RuntimeError("DESCRIPTION still imposes a Pando version floor")

          order_pairs = [
              ("'condition_grn_contract.R'", "'condition_grn_contract_compat.R'"),
              ("'mixed_pando.R'", "'mixed_pando_contract.R'"),
              ("'grn_parallel_output_contract.R'", "'grn_parallel_merge_contract.R'"),
              ("'grn_route_parallel.R'", "'grn_integration_contract.R'"),
              ("'grn_integration_contract.R'", "'condition_penalty_contract.R'"),
              ("'step_layer2.R'", "'layer2_parallel_runtime.R'"),
              ("'layer2_corda_paper_contract.R'", "'layer2_corda2_algorithm.R'"),
              ("'layer2_corda2_algorithm_build.R'", "'layer2_corda_runtime_cache.R'"),
          ]
          for first, second in order_pairs:
              if description.index(first) > description.index(second):
                  raise RuntimeError(f"invalid Collate order: {first} after {second}")

          bridge = Path("R/grn_integration_contract.R").read_text()
          required_bridge = [
              'getNamespaceExports("Pando")',
              ".rc_normalize_condition_pando_layer_args",
              "Unsupported override(s)",
          ]
          missing = [x for x in required_bridge if x not in bridge]
          if missing:
              raise RuntimeError(f"Pando runtime bridge missing: {missing}")
          if "package_version" in bridge or "packageVersion" in bridge:
              raise RuntimeError("Pando runtime bridge contains a version gate")

          penalty = Path("R/condition_penalty_contract.R").read_text()
          for value in (
              "abs(corr) >= .RC_PANDO_PENALTY_CORR_THRESHOLD",
              "abs(estimate) >= .RC_PANDO_PENALTY_ESTIMATE_THRESHOLD",
          ):
              if value not in penalty:
                  raise RuntimeError(f"condition penalty contract missing: {value}")

          step = Path("R/step_layer2.R").read_text()
          cache = Path("R/celltype_union_gem_cache.R").read_text()
          split = Path("R/layer2_corda_paper_contract.R").read_text()
          algorithm = Path("R/layer2_corda2_algorithm_build.R").read_text()
          model = Path("R/layer2_corda_model.R").read_text()
          direct_contracts = {
              "Layer 2 entrypoint": (
                  step,
                  [".rc_prepare_corda_worker_pool", ".rc_layer2_prepare_completion", ".rc_layer2_finalize_completion"],
              ),
              "union-cache dispatch": (
                  cache,
                  [".rc_build_celltype_medium_corda_cache", "context$model_completion"],
              ),
              "original CORDA2 split": (
                  split,
                  [".rc_corda2_split_original", "_CORDA_rev_rxn", ".rc_corda2_close_opposite"],
              ),
              "original CORDA2 state machine": (
                  algorithm,
                  ["HCtoMC", "HCtoNC", "MCxNC", "options$MCxNCthresh", "corda2_step3_HC_OT_dependencies"],
              ),
              "direct CORDA2 model": (
                  model,
                  [".rc_corda_parent", ".rc_corda2_split_original", ".rc_corda_build_three_stage", ".rc_corda2_apply_direction_bounds", ".rc_finalize_corda_union_model"],
              ),
          }
          for label, (text, required) in direct_contracts.items():
              missing = [x for x in required if x not in text]
              if missing:
                  raise RuntimeError(f"{label} missing: {missing}")

          forbidden_markers = ["_base <-", "before_corda2", "completion_base <-", "runtime_base <-"]
          production_files = [
              Path("R/step_layer2.R"),
              Path("R/celltype_union_gem_cache.R"),
              Path("R/layer2_corda_paper_contract.R"),
              Path("R/layer2_corda2_algorithm.R"),
              Path("R/layer2_corda2_algorithm_build.R"),
              Path("R/layer2_corda_model.R"),
              Path("R/layer2_corda_runtime.R"),
              Path("R/layer2_corda_runtime_cache.R"),
              Path("R/layer2_corda_runtime_step.R"),
          ]
          for file in production_files:
              text = file.read_text()
              found = [x for x in forbidden_markers if x in text]
              if found:
                  raise RuntimeError(f"function override marker remains in {file}: {found}")

      - name: Parse package sources
        shell: Rscript {0}
        run: |
          description <- read.dcf("DESCRIPTION")
          stopifnot(nrow(description) == 1L)
          remotes <- unname(description[1L, "Remotes"])
          stopifnot(
            grepl("1667857557/Pando_regcompass", remotes, fixed = TRUE),
            grepl("1667857557/SuperCell_Seurat_V4", remotes, fixed = TRUE),
            !grepl("@", remotes, fixed = TRUE)
          )
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) parse(file = file)

      - name: Run lightweight integration tests
        shell: Rscript {0}
        run: |
          .rc_route_pando_infer_args <- function(
              args, condition_types = character(), standard_types = character()) {
            list(
              condition = args,
              standard = list(),
              diagnostics = data.frame(
                route = character(), argument = character(),
                action = character(), stringsAsFactors = FALSE
              )
            )
          }
          .rc_bind_frames_fill <- function(values) {
            values <- values[vapply(values, is.data.frame, logical(1))]
            values <- values[vapply(values, nrow, integer(1)) > 0L]
            if (!length(values)) return(data.frame())
            out <- do.call(rbind, values)
            rownames(out) <- NULL
            out
          }
          source("R/grn_integration_contract.R")
          normalized <- .rc_normalize_condition_pando_layer_args(
            list(
              rna_layer = "data", peak_layer = "data",
              peak_value_type = "normalized", tf_cor = 0.1
            ), condition_types = "epithelial_like"
          )
          stopifnot(
            identical(normalized$supplied,
                      c("rna_layer", "peak_layer", "peak_value_type")),
            identical(names(normalized$args), "tf_cor")
          )
          rejected <- try(.rc_normalize_condition_pando_layer_args(
            list(rna_layer = "counts"), condition_types = "epithelial_like"
          ), silent = TRUE)
          stopifnot(inherits(rejected, "try-error"))

      - name: Build source package
        run: R CMD build --no-build-vignettes --no-manual .
