name: RegCompassR source check

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Validate canonical source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          description = Path("DESCRIPTION").read_text()
          required_description = [
              "'condition_grn_contract.R'",
              "'mixed_pando.R'",
              "'mixed_pando_contract.R'",
              "'grn_condition_parallel.R'",
              "'grn_route_parallel.R'",
              "'grn_parallel_merge_contract.R'",
              "'condition_penalty_contract.R'",
              "'layer2_parallel_runtime.R'",
              "'celltype_microcompass_reaction_parallel.R'",
              "'layer2_corda_paper_contract.R'",
              "'layer2_corda2_algorithm.R'",
              "'layer2_corda_model.R'",
              "    Pando,",
              "    SuperCell,",
              "1667857557/Pando_regcompass",
              "1667857557/SuperCell_Seurat_V4",
              "Config/RegCompass/PandoConditionModelSchema: pando_condition_grn_Estar_z025_inference_separated_v1",
              "Config/RegCompass/PandoConditionMethod: global-condition-union-Estar-z025-separated-inference",
              "Config/RegCompass/PandoConditionPenalty: information-scaled-sparse-deviation-z025",
              "Config/RegCompass/PandoConditionProjectionPolicy: exact-edge-whole-network-BH-common-topology",
              "Config/RegCompass/PandoConditionInference: condition-local-gaussian-LM-exact-edge-omnibus-whole-network-BH",
              "Config/RegCompass/PandoTargetR2: scheme-E-z025-full-data-R2-diagnostic",
              "Config/RegCompass/PandoTargetR2Threshold: 0.05-diagnostic-only-for-condition-GRN",
              "Config/RegCompass/PandoTargetPenaltyQ: condition-common-edge-topology-standard-route-legacy-filter",
              "Config/RegCompass/SuperCellPartition: shared-walktrap-condition-hierarchy-cut-v1",
              "Config/RegCompass/MediumSemantics: compass-exchange-bounds-v2",
              "Config/RegCompass/MediumCacheFingerprint: resolved-reaction-id-final-lb-final-ub-v1",
          ]
          missing = [x for x in required_description if x not in description]
          if missing:
              raise RuntimeError(f"DESCRIPTION integration contract missing: {missing}")
          forbidden_description = [
              "pando_condition_grn_Estar_jointse_v1",
              "global-condition-union-Estar-z025-JSE",
              "any-condition-padj-exact-edge-union",
              "fusion-component-joint-refit-condition-target-BH",
              "condition-any-condition-BH-exact-edge-union",
          ]
          present = [x for x in forbidden_description if x in description]
          if present:
              raise RuntimeError(f"obsolete condition DESCRIPTION contract remains: {present}")
          for forbidden in (
              "Pando (>=", "SuperCell (>=",
              "1667857557/Pando_regcompass@",
              "1667857557/SuperCell_Seurat_V4@",
          ):
              if forbidden in description:
                  raise RuntimeError(
                      f"repository-head dependency policy violated by: {forbidden}"
                  )

          obsolete_files = [
              "R/condition_grn_contract_compat.R",
              "R/grn_integration_contract.R",
              "R/grn_parallel_output_contract.R",
              "R/step_layer1_significance_contract.R",
          ]
          present = [x for x in obsolete_files if Path(x).exists()]
          if present:
              raise RuntimeError(f"obsolete wrapper/override source remains: {present}")

          all_r = "\n".join(
              path.read_text() for path in sorted(Path("R").glob("*.R"))
          )
          canonical = {
              "R/grn_route_parallel.R": [".rc_route_pando_infer_args"],
              "R/condition_grn_contract.R": [
                  ".rc_require_pando_condition_grn_fit",
                  ".rc_extract_condition_grn_contract",
                  ".rc_fit_condition_grns_by_cell_type",
              ],
              "R/grn_condition_parallel.R": [
                  ".rc_condition_parallel_plan",
                  ".rc_condition_prepare_celltype_task",
                  ".rc_condition_ridge_fit_task",
              ],
              "R/grn_parallel_merge_contract.R": [
                  ".rc_merge_condition_job_results",
              ],
              "R/mixed_pando.R": [
                  ".rc_merge_pando_results",
                  ".rc_active_target_penalty_q",
                  ".rc_penalty_evaluated_rows",
              ],
              "R/medium.R": [
                  "rc_apply_medium_constraints",
                  ".rc_compass_model_bound_medium",
                  "rc_make_medium_scenarios",
              ],
              "R/full_gem.R": [
                  ".rc_assert_medium_bounds_only",
                  ".rc_full_gem_medium_fingerprint",
                  ".rc_full_gem_resolved_bounds_identity",
              ],
          }
          for path, names in canonical.items():
              text = Path(path).read_text()
              for name in names:
                  pattern = re.compile(rf"(?m)^{re.escape(name)}\s*<-\s*function\b")
                  if len(pattern.findall(text)) != 1:
                      raise RuntimeError(
                          f"{name} must have exactly one canonical definition in {path}"
                      )
                  if len(pattern.findall(all_r)) != 1:
                      raise RuntimeError(
                          f"{name} is redefined outside its canonical source file"
                      )

          forbidden_names = [
              ".rc_route_pando_infer_args_core",
              ".rc_extract_condition_grn_contract_core",
              ".rc_merge_condition_job_results_core",
              ".rc_merge_pando_results_validated",
              ".rc_merge_pando_results_with_parallel_objects",
              ".rc_fit_condition_grns_regcompass_parallel",
              ".rc_condition_multitask_fit_task",
              "pando_grn_data_by_cell_type_v1",
              ".rc_cell_first_projection_layer1_v6",
          ]
          present = [value for value in forbidden_names if value in all_r]
          if present:
              raise RuntimeError(f"versioned/wrapper implementation remains: {present}")

          condition = Path("R/condition_grn_contract.R").read_text()
          required_condition = [
              '"pando_condition_grn_Estar_z025_inference_separated_v1"',
              '"condition_union_Estar_z025_inference_separated"',
              '"frozen_dictionary_condition_local_gaussian_lm_edge_omnibus_v1"',
              '"exact_edge_whole_network_BH_common_topology"',
              '"exact_edge_whole_cell_type_network_BH"',
              '"information_scaled_sparse_deviation"',
              ".RC_PANDO_CONDITION_SCHEME_E_Z <- 0.25",
              "reference_condition",
              "dictionary_support_table",
              "dictionary_support_summary",
              "candidate_tf_cor",
              "candidate_peak_cor",
              "condition_inference_estimable",
              "inference_estimate",
              "inference_se",
              "inference_variance",
              "condition_pval",
              "edge_inference",
              "edge_df",
              "edge_statistic",
              "edge_pval",
              "edge_padj",
              "edge_inference_estimable",
              "edge_supported",
              "all_conditions_fit_valid",
              "active_in_regcompass",
              "penalty_effect",
              "shared_by_boundary",
              "boundary_condition",
              "fused_by_penalty",
              "fusion_component_id",
              "raw_information_condition",
              "profile_information",
              "solver_status",
              "kkt_residual",
          ]
          missing = [x for x in required_condition if x not in condition]
          if missing:
              raise RuntimeError(f"separated-inference condition contract missing: {missing}")
          forbidden_condition = [
              "pando_condition_grn_Estar_jointse_v1",
              "condition_union_Estar_z025_jointse",
              "scheme_e_fusion_component_joint_refit_v1",
              '"condition_target_BH"',
              '"any_condition_padj_exact_edge_union"',
              "inference_component_id",
              "inference_hypothesis_id",
              "condition_significant",
              "supporting_conditions",
              "edge_union_supported",
              "pando_condition_grn_multitask_ridge_v3",
              "pando_condition_grn_sparse_deviation_v4",
          ]
          present = [x for x in forbidden_condition if x in condition]
          if present:
              raise RuntimeError(f"obsolete condition contract remains: {present}")

          penalty = Path("R/condition_penalty_contract.R").read_text()
          required_penalty = [
              ".rc_expected_edge_inference_from_coefficients",
              ".rc_validate_pando_active_condition_edges",
              ".rc_condition_penalty_gate",
              ".RC_PANDO_TARGET_RSQ_THRESHOLD <- 0.05",
              "condition_inference_estimable",
              "inference_variance",
              "condition_pval",
              "edge_inference_estimable",
              "edge_pval",
              "edge_padj",
              "edge_supported",
              "active_in_regcompass",
              '"exact_edge_whole_cell_type_network_BH"',
              "target_model_supported",
              "scheme_e_z025_full_data_R2_diagnostic",
          ]
          missing = [x for x in required_penalty if x not in penalty]
          if missing:
              raise RuntimeError(f"separated-inference penalty contract missing: {missing}")
          forbidden_penalty = [
              "condition_significant",
              "edge_union_supported",
              "supporting_conditions",
              "n_supporting_conditions",
              "consume_pando_condition_bh_active_edge_without_reselection",
          ]
          present = [x for x in forbidden_penalty if x in penalty]
          if present:
              raise RuntimeError(f"obsolete conditional penalty gate remains: {present}")

          step1 = Path("R/step_grn_common_dictionary.R").read_text()
          for marker in (
              "target_rsq_threshold = 0.05",
              ".rc_target_rsq_threshold(target_rsq_threshold)",
              "options(RegCompassR.target_rsq_threshold = target_rsq_threshold)",
          ):
              if marker not in step1:
                  raise RuntimeError(f"Stage 1 target-R2 diagnostic surface missing: {marker}")

          full_gem = Path("R/full_gem.R").read_text()
          for marker in (
              "resolved_gem_bounds_v1",
              "reaction_id = reference$reactions",
              "final_lb = as.numeric(resolved$lb)",
              "final_ub = as.numeric(resolved$ub)",
              "resolved_medium_fingerprint",
          ):
              if marker not in full_gem:
                  raise RuntimeError(f"resolved medium cache contract missing: {marker}")

          direct_contracts = {
              "R/step_layer2.R": [
                  ".rc_prepare_corda_worker_pool",
                  ".rc_layer2_prepare_completion",
                  ".rc_layer2_finalize_completion",
              ],
              "R/layer2_corda_paper_contract.R": [
                  ".rc_corda2_split_original", "_CORDA_rev_rxn",
                  ".rc_corda2_close_opposite",
              ],
              "R/layer2_corda2_algorithm_build.R": [
                  "HCtoMC", "HCtoNC", "MCxNC", "options$MCxNCthresh",
              ],
              "R/layer2_corda_model.R": [
                  ".rc_corda_parent", ".rc_corda2_split_original",
                  ".rc_corda_build_three_stage",
                  ".rc_corda2_apply_direction_bounds",
                  ".rc_finalize_corda_union_model",
              ],
          }
          for path, markers in direct_contracts.items():
              text = Path(path).read_text()
              missing = [x for x in markers if x not in text]
              if missing:
                  raise RuntimeError(f"{path} direct contract missing: {missing}")

      - name: Parse package sources and Rd files
        shell: Rscript {0}
        run: |
          description <- read.dcf("DESCRIPTION")
          stopifnot(nrow(description) == 1L)
          remotes <- unname(description[1L, "Remotes"])
          stopifnot(
            grepl("1667857557/Pando_regcompass", remotes, fixed = TRUE),
            grepl("1667857557/SuperCell_Seurat_V4", remotes, fixed = TRUE),
            !grepl("@", remotes, fixed = TRUE)
          )
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) parse(file = file)
          rd_files <- list.files("man", pattern = "[.]Rd$", full.names = TRUE)
          old_warn <- getOption("warn")
          options(warn = 2)
          on.exit(options(warn = old_warn), add = TRUE)
          invisible(lapply(rd_files, tools::parse_Rd))

      - name: Build source package
        run: R CMD build --no-build-vignettes --no-manual .
