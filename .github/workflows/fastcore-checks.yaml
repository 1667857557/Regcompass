name: RegCompassR source check

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Validate canonical source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          description = Path("DESCRIPTION").read_text()
          required_description = [
              "'condition_grn_contract.R'",
              "'mixed_pando.R'",
              "'mixed_pando_contract.R'",
              "'grn_condition_parallel.R'",
              "'grn_route_parallel.R'",
              "'grn_parallel_merge_contract.R'",
              "'condition_penalty_contract.R'",
              "'layer2_parallel_runtime.R'",
              "'celltype_microcompass_reaction_parallel.R'",
              "'layer2_corda_paper_contract.R'",
              "'layer2_corda2_algorithm.R'",
              "'layer2_corda_model.R'",
              "    Pando,",
              "    SuperCell,",
              "1667857557/Pando_regcompass",
              "1667857557/SuperCell_Seurat_V4",
              "Config/RegCompass/PandoConditionModelSchema: pando_condition_grn_multitask_ridge_v3",
              "Config/RegCompass/PandoConditionProjectionPolicy: condition-BH-supported-common-dictionary-ridge",
              "Config/RegCompass/PandoConditionMethod: global-condition-union-single-no-fusion-ridge",
              "Config/RegCompass/PandoTargetR2: selected-lambda-full-data-R2",
              "Config/RegCompass/PandoTargetR2Threshold: 0.05",
              "Config/RegCompass/SuperCellPartition: shared-walktrap-condition-hierarchy-cut-v1",
              "Config/RegCompass/MediumSemantics: compass-exchange-bounds-v2",
              "Config/RegCompass/MediumCacheFingerprint: resolved-reaction-id-final-lb-final-ub-v1",
          ]
          missing = [x for x in required_description if x not in description]
          if missing:
              raise RuntimeError(f"DESCRIPTION integration contract missing: {missing}")
          for forbidden in (
              "Pando (>=", "SuperCell (>=",
              "1667857557/Pando_regcompass@",
              "1667857557/SuperCell_Seurat_V4@",
          ):
              if forbidden in description:
                  raise RuntimeError(
                      f"repository-head dependency policy violated by: {forbidden}"
                  )

          obsolete_files = [
              "R/condition_grn_contract_compat.R",
              "R/grn_integration_contract.R",
              "R/grn_parallel_output_contract.R",
              "R/step_layer1_significance_contract.R",
          ]
          present = [x for x in obsolete_files if Path(x).exists()]
          if present:
              raise RuntimeError(f"obsolete wrapper/override source remains: {present}")

          order_pairs = [
              ("'condition_grn_contract.R'", "'grn_condition_parallel.R'"),
              ("'grn_condition_parallel.R'", "'grn_route_parallel.R'"),
              ("'mixed_pando.R'", "'grn_route_parallel.R'"),
              ("'grn_route_parallel.R'", "'condition_penalty_contract.R'"),
              ("'step_layer2.R'", "'layer2_parallel_runtime.R'"),
              ("'layer2_corda_paper_contract.R'", "'layer2_corda2_algorithm.R'"),
              ("'layer2_corda2_algorithm_build.R'", "'layer2_corda_runtime_cache.R'"),
          ]
          for first, second in order_pairs:
              if description.index(first) > description.index(second):
                  raise RuntimeError(f"invalid Collate order: {first} after {second}")

          all_r = "\n".join(
              path.read_text() for path in sorted(Path("R").glob("*.R"))
          )
          canonical = {
              "R/grn_route_parallel.R": [".rc_route_pando_infer_args"],
              "R/condition_grn_contract.R": [
                  ".rc_require_pando_condition_grn_fit",
                  ".rc_extract_condition_grn_contract",
                  ".rc_fit_condition_grns_by_cell_type",
              ],
              "R/grn_condition_parallel.R": [
                  ".rc_condition_parallel_plan",
                  ".rc_condition_prepare_celltype_task",
                  ".rc_condition_ridge_fit_task",
              ],
              "R/grn_parallel_merge_contract.R": [
                  ".rc_merge_condition_job_results",
              ],
              "R/mixed_pando.R": [
                  ".rc_merge_pando_results",
                  ".rc_active_target_penalty_q",
                  ".rc_penalty_evaluated_rows",
              ],
              "R/medium.R": [
                  "rc_apply_medium_constraints",
                  ".rc_compass_model_bound_medium",
                  "rc_make_medium_scenarios",
              ],
              "R/full_gem.R": [
                  ".rc_assert_medium_bounds_only",
                  ".rc_full_gem_medium_fingerprint",
                  ".rc_full_gem_resolved_bounds_identity",
              ],
          }
          for path, names in canonical.items():
              text = Path(path).read_text()
              for name in names:
                  pattern = re.compile(
                      rf"(?m)^{re.escape(name)}\s*<-\s*function\b"
                  )
                  if len(pattern.findall(text)) != 1:
                      raise RuntimeError(
                          f"{name} must have exactly one canonical definition in {path}"
                      )
                  if len(pattern.findall(all_r)) != 1:
                      raise RuntimeError(
                          f"{name} is redefined outside its canonical source file"
                      )

          forbidden_names = [
              ".rc_route_pando_infer_args_core",
              ".rc_extract_condition_grn_contract_core",
              ".rc_merge_condition_job_results_core",
              ".rc_merge_pando_results_validated",
              ".rc_merge_pando_results_with_parallel_objects",
              ".rc_fit_condition_grns_regcompass_parallel",
              ".rc_condition_multitask_fit_task",
              "pando_grn_data_by_cell_type_v1",
              ".rc_cell_first_projection_layer1_v6",
          ]
          present = [value for value in forbidden_names if value in all_r]
          if present:
              raise RuntimeError(f"versioned/wrapper implementation remains: {present}")

          medium_semantics = Path("R/compass_medium_semantics.R").read_text()
          forbidden_medium_overrides = [
              "rc_apply_medium_constraints <- .rc_apply_compass_medium_constraints",
              ".rc_compass_model_bound_medium <- .rc_make_compass_model_bound_medium",
              ".rc_assert_medium_bounds_only <- .rc_assert_compass_medium_bounds_only",
              ".rc_full_gem_medium_fingerprint <- .rc_compass_medium_fingerprint",
              ".rc_compass_medium_fingerprint <- function",
          ]
          present = [x for x in forbidden_medium_overrides if x in medium_semantics]
          if present:
              raise RuntimeError(f"late-bound or declarative medium override remains: {present}")
          full_gem = Path("R/full_gem.R").read_text()
          required_resolved_cache = [
              "resolved_gem_bounds_v1",
              "reaction_id = reference$reactions",
              "final_lb = as.numeric(resolved$lb)",
              "final_ub = as.numeric(resolved$ub)",
              "resolved_medium_fingerprint",
              "n_changed_bounds_vs_reference",
              "resolved_bounds_identical_to_reference",
          ]
          missing = [x for x in required_resolved_cache if x not in full_gem]
          if missing:
              raise RuntimeError(f"resolved medium cache contract missing: {missing}")

          condition = Path("R/condition_grn_contract.R").read_text()
          required_condition_semantics = [
              "dictionary_support_table",
              "dictionary_support_summary",
              "candidate_tf_cor",
              "candidate_peak_cor",
              "expected_statistical <- one$estimable %in% TRUE",
              "expected_global <-",
              "expected_local <-",
              "expected_active <- expected_statistical",
              "!identical(as.logical(one$global_support), expected_global)",
              "!identical(as.logical(one$local_support), expected_local)",
              "!identical(as.logical(one$active), expected_active)",
          ]
          missing = [x for x in required_condition_semantics if x not in condition]
          if missing:
              raise RuntimeError(f"condition activity semantics missing: {missing}")
          forbidden_condition = [
              "screening_n_significant_conditions",
              "preliminary_joint_ridge_bh_significant_union_then_joint_refit",
              "two_stage_exact_edge_union_multitask_ridge",
              "expected_statistical & (expected_global | expected_local)",
          ]
          present = [x for x in forbidden_condition if x in condition]
          if present:
              raise RuntimeError(f"obsolete condition contract remains: {present}")

          penalty = Path("R/condition_penalty_contract.R").read_text()
          required_penalty = [
              ".rc_validate_pando_active_condition_edges",
              ".rc_condition_penalty_gate",
              ".RC_PANDO_TARGET_RSQ_THRESHOLD <- 0.05",
              "statistically_supported",
              "global_support",
              "local_support",
              "expected_active <- expected_statistical",
              'fit_status == "ok"',
              "target_rsq >= rsq_threshold",
              "selected_lambda_full_data_R2",
              ".RC_PANDO_PENALTY_CORR_THRESHOLD <- 0",
              ".RC_PANDO_PENALTY_ESTIMATE_THRESHOLD <- 0",
              "consume_pando_condition_bh_active_edge_without_reselection",
          ]
          missing = [x for x in required_penalty if x not in penalty]
          if missing:
              raise RuntimeError(f"active condition ridge penalty contract missing: {missing}")
          if "expected_statistical & expected_dictionary_support" in penalty:
              raise RuntimeError("candidate provenance still vetoes RegCompass activity")

          step1 = Path("R/step_grn_common_dictionary.R").read_text()
          required_stage1 = [
              "target_rsq_threshold = 0.05",
              ".rc_target_rsq_threshold(target_rsq_threshold)",
              "options(RegCompassR.target_rsq_threshold = target_rsq_threshold)",
          ]
          missing = [x for x in required_stage1 if x not in step1]
          if missing:
              raise RuntimeError(f"Stage 1 target-R2 parameter surface missing: {missing}")

          step = Path("R/step_layer2.R").read_text()
          cache = Path("R/celltype_union_gem_cache.R").read_text()
          split = Path("R/layer2_corda_paper_contract.R").read_text()
          algorithm = Path("R/layer2_corda2_algorithm_build.R").read_text()
          model = Path("R/layer2_corda_model.R").read_text()
          direct_contracts = {
              "Layer 2 entrypoint": (
                  step,
                  [".rc_prepare_corda_worker_pool", ".rc_layer2_prepare_completion", ".rc_layer2_finalize_completion"],
              ),
              "union-cache dispatch": (
                  cache,
                  [".rc_build_celltype_medium_corda_cache", "context$model_completion"],
              ),
              "original CORDA2 split": (
                  split,
                  [".rc_corda2_split_original", "_CORDA_rev_rxn", ".rc_corda2_close_opposite"],
              ),
              "original CORDA2 state machine": (
                  algorithm,
                  ["HCtoMC", "HCtoNC", "MCxNC", "options$MCxNCthresh", "corda2_step3_HC_OT_dependencies"],
              ),
              "direct CORDA2 model": (
                  model,
                  [".rc_corda_parent", ".rc_corda2_split_original", ".rc_corda_build_three_stage", ".rc_corda2_apply_direction_bounds", ".rc_finalize_corda_union_model"],
              ),
          }
          for label, (text, required) in direct_contracts.items():
              missing = [x for x in required if x not in text]
              if missing:
                  raise RuntimeError(f"{label} missing: {missing}")

          forbidden_markers = [
              "_base <-", "before_corda2", "completion_base <-", "runtime_base <-"
          ]
          production_files = [
              Path("R/step_layer2.R"),
              Path("R/celltype_union_gem_cache.R"),
              Path("R/layer2_corda_paper_contract.R"),
              Path("R/layer2_corda2_algorithm.R"),
              Path("R/layer2_corda2_algorithm_build.R"),
              Path("R/layer2_corda_model.R"),
              Path("R/layer2_corda_runtime.R"),
              Path("R/layer2_corda_runtime_cache.R"),
              Path("R/layer2_corda_runtime_step.R"),
          ]
          for file in production_files:
              text = file.read_text()
              found = [x for x in forbidden_markers if x in text]
              if found:
                  raise RuntimeError(f"function override marker remains in {file}: {found}")

      - name: Parse package sources
        shell: Rscript {0}
        run: |
          description <- read.dcf("DESCRIPTION")
          stopifnot(nrow(description) == 1L)
          remotes <- unname(description[1L, "Remotes"])
          stopifnot(
            grepl("1667857557/Pando_regcompass", remotes, fixed = TRUE),
            grepl("1667857557/SuperCell_Seurat_V4", remotes, fixed = TRUE),
            !grepl("@", remotes, fixed = TRUE)
          )
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) parse(file = file)
          rd_files <- list.files("man", pattern = "[.]Rd$", full.names = TRUE)
          old_warn <- getOption("warn")
          options(warn = 2)
          on.exit(options(warn = old_warn), add = TRUE)
          invisible(lapply(rd_files, tools::parse_Rd))

      - name: Run lightweight integration tests
        shell: Rscript {0}
        run: |
          `%||%` <- function(x, y) if (is.null(x)) y else x
          .rc_standard_pando_padj_default <- 0.05
          .rc_require_pando_condition_grn_fit <- function(x) invisible(TRUE)
          source("R/condition_penalty_contract.R")
          estimate <- c(1e-8, 2, 3, NA_real_)
          estimable <- c(TRUE, TRUE, TRUE, FALSE)
          padj <- c(0.01, 0.08, 0.2, NA_real_)
          statistically_supported <- c(TRUE, TRUE, TRUE, FALSE)
          global_support <- c(TRUE, TRUE, FALSE, FALSE)
          local_support <- c(FALSE, FALSE, FALSE, TRUE)
          active <- statistically_supported
          coefficient <- data.frame(
            estimate = estimate,
            estimable = estimable,
            padj = padj,
            statistically_supported = statistically_supported,
            global_support = global_support,
            local_support = local_support,
            active = active,
            significant = active,
            penalty_effect = ifelse(active, estimate, 0),
            fit_status = c("ok", "rank_deficient", "ok", "ok"),
            rsq = c(0.8, 0.9, 0.01, 0.7),
            stringsAsFactors = FALSE
          )
          stopifnot(identical(
            .rc_condition_penalty_gate(coefficient, padj_threshold = 0.5),
            c(TRUE, FALSE, FALSE, FALSE)
          ))
          stopifnot(inherits(
            try(.rc_condition_penalty_gate(coefficient, padj_threshold = 1),
                silent = TRUE),
            "try-error"
          ))

      - name: Build source package
        run: R CMD build --no-build-vignettes --no-manual .
