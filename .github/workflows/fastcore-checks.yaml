name: RegCompassR source check

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Validate cross-package source contract
        shell: python
        run: |
          from pathlib import Path
          description = Path("DESCRIPTION").read_text()
          required_description = [
              "Version: 2.4.3",
              "Pando (>= 2.0.3)",
              "'condition_grn_contract_compat.R'",
              "'mixed_pando_contract.R'",
              "'grn_integration_contract.R'",
          ]
          missing = [value for value in required_description if value not in description]
          if missing:
              raise RuntimeError(f"DESCRIPTION integration contract missing: {missing}")
          if description.index("'condition_grn_contract.R'") > description.index("'condition_grn_contract_compat.R'"):
              raise RuntimeError("condition contract compatibility file loads too early")
          if description.index("'mixed_pando.R'") > description.index("'mixed_pando_contract.R'"):
              raise RuntimeError("mixed-Pando merge contract loads too early")
          if description.index("'grn_route_parallel.R'") > description.index("'grn_integration_contract.R'"):
              raise RuntimeError("GRN integration contract loads before argument routing")
          compat = Path("R/condition_grn_contract_compat.R").read_text()
          required_fit = [
              "condition_col", "cell_type_col", "fit_engine",
              "coefficient_scale", "target_genes",
              "target-level fit diagnostics are incomplete",
              ".rc_validate_pando_fit_metadata_frame",
              "disagree with stored object metadata",
          ]
          missing = [value for value in required_fit if value not in compat]
          if missing:
              raise RuntimeError(f"downstream fit validation missing: {missing}")
          mixed = Path("R/mixed_pando_contract.R").read_text()
          required_mixed = [
              ".rc_validate_pando_route_partition",
              ".rc_validate_pando_result_cell_partition",
              "projection overlaps an existing route",
          ]
          missing = [value for value in required_mixed if value not in mixed]
          if missing:
              raise RuntimeError(f"mixed Pando route contract missing: {missing}")
          bridge = Path("R/grn_integration_contract.R").read_text()
          required_bridge = [
              "Pando >= 2.0.3",
              ".rc_normalize_condition_pando_layer_args",
              "Unsupported override(s)",
          ]
          missing = [value for value in required_bridge if value not in bridge]
          if missing:
              raise RuntimeError(f"Pando runtime bridge missing: {missing}")
      - name: Parse package sources
        shell: Rscript {0}
        run: |
          description <- read.dcf("DESCRIPTION")
          stopifnot(nrow(description) == 1L)
          remotes <- unname(description[1L, "Remotes"])
          stopifnot(
            grepl("1667857557/Pando_regcompass", remotes, fixed = TRUE),
            grepl("1667857557/SuperCell_Seurat_V4", remotes, fixed = TRUE),
            !grepl("@", remotes, fixed = TRUE)
          )
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) parse(file = file)
      - name: Run lightweight integration tests
        shell: Rscript {0}
        run: |
          .rc_require_pando_condition_grn_fit <- function(fit) invisible(TRUE)
          .rc_extract_condition_grn_contract <- function(...) invisible(TRUE)
          source("R/condition_grn_contract_compat.R")
          dictionary <- data.frame(edge_id = "TP53||TF||chr1:1-2")
          attr(dictionary, "preprocessing_provenance_verified") <- TRUE
          fit <- structure(list(
            cell_type = "epithelial_like",
            condition_levels = c("control", "treated"),
            condition_cell_ids = list(control = "cell1", treated = "cell2"),
            edge_dictionary = dictionary,
            dictionary_preprocessing_provenance_verified = TRUE,
            condition_col = "dataset",
            cell_type_col = "cell_type",
            fit_engine = "two_stage_exact_edge_union_fixed_dictionary_glm",
            coefficient_scale = "shared_preprocessed_input_units_unscaled",
            target_genes = "TP53",
            fit = data.frame(
              target = c("TP53", "TP53"),
              condition = c("control", "treated"),
              rsq = c(0.2, 0.3),
              fit_status = c("ok", "ok")
            )
          ), class = c("ConditionGRNFit", "list"))
          stopifnot(isTRUE(.rc_require_pando_condition_grn_fit(fit)))
          overlapping <- fit
          overlapping$condition_cell_ids$treated <- "cell1"
          rejected <- try(
            .rc_require_pando_condition_grn_fit(overlapping), silent = TRUE
          )
          stopifnot(inherits(rejected, "try-error"))
          metadata <- data.frame(
            dataset = c("control", "treated"),
            cell_type = c("epithelial_like", "epithelial_like"),
            row.names = c("cell1", "cell2"),
            stringsAsFactors = FALSE
          )
          stopifnot(isTRUE(.rc_validate_pando_fit_metadata_frame(
            metadata, list(fit), "dataset", "cell_type"
          )))
          wrong_metadata <- metadata
          wrong_metadata["cell2", "dataset"] <- "control"
          rejected <- try(
            .rc_validate_pando_fit_metadata_frame(
              wrong_metadata, list(fit), "dataset", "cell_type"
            ),
            silent = TRUE
          )
          stopifnot(inherits(rejected, "try-error"))

          .rc_merge_pando_results <- function(...) list()
          source("R/mixed_pando_contract.R")
          stopifnot(isTRUE(.rc_validate_pando_route_partition(
            "epithelial_like", "stem_like"
          )))
          rejected <- try(
            .rc_validate_pando_route_partition(
              "epithelial_like", "epithelial_like"
            ),
            silent = TRUE
          )
          stopifnot(inherits(rejected, "try-error"))
          duplicate_results <- list(
            list(paired_cell_metadata = data.frame(cell_id = "cell1")),
            list(paired_cell_metadata = data.frame(cell_id = "cell1"))
          )
          rejected <- try(
            .rc_validate_pando_result_cell_partition(duplicate_results),
            silent = TRUE
          )
          stopifnot(inherits(rejected, "try-error"))
          target <- matrix(
            1, nrow = 1, dimnames = list("gene", "unit")
          )
          rejected <- try(
            .rc_overlay_projection(target, target, "Standard-Pando"),
            silent = TRUE
          )
          stopifnot(inherits(rejected, "try-error"))

          .rc_route_pando_infer_args <- function(
              args, condition_types = character(), standard_types = character()) {
            list(
              condition = args,
              standard = list(),
              diagnostics = data.frame(
                route = character(), argument = character(),
                action = character(), stringsAsFactors = FALSE
              )
            )
          }
          .rc_bind_frames_fill <- function(values) {
            values <- values[vapply(values, is.data.frame, logical(1))]
            values <- values[vapply(values, nrow, integer(1)) > 0L]
            if (!length(values)) return(data.frame())
            out <- do.call(rbind, values)
            rownames(out) <- NULL
            out
          }
          source("R/grn_integration_contract.R")
          normalized <- .rc_normalize_condition_pando_layer_args(
            list(
              rna_layer = "data", peak_layer = "data",
              peak_value_type = "normalized", tf_cor = 0.1
            ),
            condition_types = "epithelial_like"
          )
          stopifnot(
            identical(normalized$supplied,
                      c("rna_layer", "peak_layer", "peak_value_type")),
            identical(names(normalized$args), "tf_cor")
          )
          rejected <- try(
            .rc_normalize_condition_pando_layer_args(
              list(rna_layer = "counts"),
              condition_types = "epithelial_like"
            ),
            silent = TRUE
          )
          stopifnot(inherits(rejected, "try-error"))
      - name: Build source package
        run: R CMD build --no-build-vignettes --no-manual .
