name: Current common-dictionary contract

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Parse current R and test sources
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) parse(file = file)
      - name: Verify unique current functions and schemas
        shell: python
        run: |
          from pathlib import Path
          import re
          files = sorted(Path("R").glob("*.R"))
          pattern = re.compile(
              r"(?m)^([A-Za-z.][A-Za-z0-9._]*)\s*<-\s*function\b"
          )
          definitions = {}
          for path in files:
              for name in pattern.findall(path.read_text()):
                  definitions.setdefault(name, []).append(str(path))
          duplicate = {
              name: paths for name, paths in definitions.items()
              if len(paths) > 1
          }
          if duplicate:
              raise RuntimeError(f"duplicate top-level functions: {duplicate}")
          source = "\n".join(path.read_text() for path in files)
          required_functions = {
              "rc_regcompass_step_grn",
              "rc_regcompass_step_metacells",
              "rc_regcompass_step_meta_modules",
              "rc_regcompass_step_layer1",
              "rc_regcompass_step_layer2",
              "rc_regcompass_step_results",
              ".rc_require_pando_condition_grn_fit",
              ".rc_extract_condition_grn_contract",
              ".rc_condition_pando_projection",
              ".rc_validate_layer1_stage",
              ".rc_validate_layer2_stage",
              ".rc_build_celltype_medium_union_gem_cache",
              ".rc_run_celltype_microcompass_engine",
          }
          missing = sorted(required_functions.difference(definitions))
          if missing:
              raise RuntimeError(f"missing current functions: {missing}")
          required_contracts = [
              "regcompass_regulatory_layer1_v4",
              "regcompass_regulatory_layer2_v3",
              "reaction_regulatory_support_fraction",
              'primary = "penalty"',
              'rna_control = "penalty_rna_only"',
              'merge_scope <- "cell_type"',
              'cross_celltype_merge <- FALSE',
              'shared_across_cell_types <- FALSE',
          ]
          absent = [token for token in required_contracts
                    if token not in source]
          if absent:
              raise RuntimeError(f"current contract incomplete: {absent}")
      - name: Reject retired APIs and fields
        shell: python
        run: |
          from pathlib import Path
          roots = [Path("R"), Path("tests/testthat"), Path("docs"),
                   Path("vignettes"), Path("man"), Path("README.md")]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(path for path in root.rglob("*") if path.is_file())
          text = "\n".join(
              path.read_text(errors="ignore") for path in files
          )
          retired = [
              "condition_full_oof", "common_oof", "condition_unique_oof",
              "project_condition_grn_primary_cells",
              "min_abs_estimate", "min_model_rsq",
              "structural_zero_probability", "nested_cv_used",
              "projection_component", "comparison_support",
              "regulatory_alpha",
          ]
          present = [token for token in retired if token in text]
          if present:
              raise RuntimeError(f"retired API remains: {present}")
      - name: Verify exact companion dependency
        shell: bash
        run: |
          grep -F '1667857557/Pando_regcompass@9b8cde926e176e853c824301a7daf6061d036031' DESCRIPTION
          grep -F 'Config/RegCompass/PandoConditionSchema: pando_condition_grn_common_dictionary_v1' DESCRIPTION
          test ! -e R/condition_full_contract.R
          test ! -e .github/workflows/seurat-v5-compatibility.yaml
