name: Common dictionary condition contract

on:
  pull_request:
  push:
    branches: [Main]

jobs:
  package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            github::1667857557/Pando_regcompass@5c451e192831713ed955cd03276ddf47e89a4ec2
      - name: Verify functional source layout
        shell: bash
        run: |
          test ! -e R/condition_grn_runtime.R
          test ! -e R/condition_grn_runtime_guard.R
          test ! -e R/step_layer1_oof.R
          test ! -e R/step_layer1_common_dictionary_contract.R
          test ! -e R/target_union_anchors.R
          test ! -e R/union_gem_cache.R
          test -e R/celltype_union_gem_cache.R
          test -e R/celltype_microcompass_engine.R
          test -z "$(find R -maxdepth 1 -type f -name 'zzz*.R' -print -quit)"
          ! grep -R -n -E 'Pando::project_condition_grn_primary_cells|Pando::condition_grn_native|_strict_base|\.rc_original_|evaluation_environment' R NAMESPACE DESCRIPTION
          ! grep -R -n -E '\.rc_merge_meta_module_catalogue|\.rc_build_medium_specific_union_gem_cache|\.rc_complete_medium_union_gem|\.rc_read_cached_union_gem|one_final_union_gem_per_medium_shared_across_all_units|single_global_fastcore_after_meta_module_merge|shared_across_cell_types[[:space:]]*=[[:space:]]*TRUE|definition\$params\$merged_core_reactions_not_rescored|definition\$params\$cached_union_unavailable_reactions' R DESCRIPTION
      - name: Parse all R and test sources
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) {
            tryCatch(
              parse(file = file),
              error = function(e) stop(file, ": ", conditionMessage(e))
            )
          }
      - name: Verify unique and scoped function definitions
        shell: python
        run: |
          import collections, pathlib, re

          pattern = re.compile(
              r'(?m)^([A-Za-z.][A-Za-z0-9._]*)\s*<-\s*function\b'
          )
          found = collections.defaultdict(list)
          source = {}
          for path in sorted(pathlib.Path('R').glob('*.R')):
              text = path.read_text()
              source[str(path)] = text
              for match in pattern.finditer(text):
                  found[match.group(1)].append(str(path))
          duplicate = {
              name: paths for name, paths in found.items() if len(paths) > 1
          }
          if duplicate:
              raise SystemExit(f'Duplicate function definitions: {duplicate}')

          required = {
              'rc_regcompass_step_grn',
              'rc_regcompass_step_metacells',
              'rc_regcompass_step_layer2',
              'rc_regcompass_step_results',
              '.rc_require_pando_condition_grn_fit',
              '.rc_extract_condition_grn_contract',
              '.rc_condition_pando_projection',
              '.rc_validate_layer1_stage',
              '.rc_validate_target_union_anchor_request',
              '.rc_build_target_union_definition',
              '.rc_merge_meta_modules_by_cell_type',
              '.rc_build_celltype_medium_union_gem_cache',
              '.rc_complete_celltype_medium_union_gem',
              '.rc_read_celltype_union_gem',
              '.rc_run_celltype_microcompass_engine',
              '.rc_run_shared_full_gem_engine',
              '.rc_run_microcompass_engine'
          }
          missing = sorted(required.difference(found))
          if missing:
              raise SystemExit(f'Missing functional definitions: {missing}')

          if len(found['.rc_run_microcompass_engine']) != 1:
              raise SystemExit('microCOMPASS dispatcher must be unique')

          all_text = '\n'.join(source.values())
          required_contracts = [
              'merge_scope <- "cell_type"',
              'cross_celltype_merge <- FALSE',
              'shared_across_conditions <- TRUE',
              'shared_across_cell_types <- FALSE',
              'celltype_specific_fastcore_after_condition_module_union',
              'structural_scope = "cell_type_x_medium"',
              'unit_celltype == cell_type',
              'all(cache_celltypes %in% unit_celltypes)',
              'direct_database_crossrefs_within_cell_type_only'
          ]
          absent = [value for value in required_contracts if value not in all_text]
          if absent:
              raise SystemExit(
                  f'Incomplete cell-type structural contract: {absent}'
              )
      - name: Verify installed Pando contract
        shell: Rscript {0}
        run: |
          d <- utils::packageDescription("Pando")
          stopifnot(
            identical(
              d[["Config/Pando/ConditionGRNSchema"]],
              "pando_condition_grn_common_dictionary_v1"
            ),
            identical(
              d[["Config/Pando/ConditionGRNMethod"]],
              "two-stage-exact-edge-union-fixed-dictionary-glm"
            ),
            identical(
              d[["Config/Pando/ConditionEffectFilter"]],
              "BH-adjusted-p-below-0.05"
            )
          )
          required <- c(
            "infer_condition_grn", "condition_grn_fit",
            "discover_grn_edges", "union_grn_edges", "fit_grn_from_edges",
            "project_condition_grn_cells",
            "aggregate_condition_grn_projection"
          )
          ns <- asNamespace("Pando")
          stopifnot(all(vapply(required, exists, logical(1),
                               envir = ns, inherits = FALSE)))
      - name: Check package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(args = c('--no-manual'), error_on = 'error')