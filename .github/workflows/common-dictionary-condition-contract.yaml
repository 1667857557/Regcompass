name: Common dictionary condition contract

on:
  pull_request:
  push:
    branches: [Main]

jobs:
  package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            github::1667857557/Pando_regcompass@5c451e192831713ed955cd03276ddf47e89a4ec2
      - name: Verify retired condition runtime is absent
        shell: bash
        run: |
          test ! -e R/condition_grn_runtime.R
          test ! -e R/condition_grn_runtime_guard.R
          ! grep -R -n -E 'outer_nfolds|inner_nfolds|condition_mix|project_condition_grn_primary_cells' R NAMESPACE DESCRIPTION
      - name: Verify installed Pando contract
        shell: Rscript {0}
        run: |
          d <- utils::packageDescription("Pando")
          stopifnot(
            identical(
              d[["Config/Pando/ConditionGRNSchema"]],
              "pando_condition_grn_common_dictionary_v1"
            ),
            identical(
              d[["Config/Pando/ConditionGRNMethod"]],
              "two-stage-exact-edge-union-fixed-dictionary-glm"
            ),
            identical(
              d[["Config/Pando/ConditionEffectFilter"]],
              "BH-adjusted-p-below-0.05"
            )
          )
          required <- c(
            "infer_condition_grn", "condition_grn_fit",
            "discover_grn_edges", "union_grn_edges", "fit_grn_from_edges",
            "project_condition_grn_cells",
            "aggregate_condition_grn_projection"
          )
          ns <- asNamespace("Pando")
          stopifnot(all(vapply(required, exists, logical(1),
                               envir = ns, inherits = FALSE)))
      - name: Check package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(args = c('--no-manual'), error_on = 'error')
