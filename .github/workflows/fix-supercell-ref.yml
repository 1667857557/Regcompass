name: Fix SuperCell2 install ref

on:
  pull_request:
    branches:
      - Main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-supercell2-install-ref
          fetch-depth: 0
      - name: Update metacell install guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("R/metacell.R")
          text = path.read_text(encoding="utf-8")
          old_ref = "1667857557/SuperCell_Seurat_V4@supercell-2.0"
          new_ref = "1667857557/SuperCell_Seurat_V4@Supercell2"
          upstream_hint = " (or the upstream mirror `GfellerLab/SuperCell@supercell-2.0`)"

          if text.count(old_ref) != 2:
              raise SystemExit(f"Expected exactly 2 obsolete fork refs, found {text.count(old_ref)}")
          if text.count(upstream_hint) != 1:
              raise SystemExit(f"Expected exactly 1 obsolete upstream hint, found {text.count(upstream_hint)}")

          text = text.replace(old_ref, new_ref)
          text = text.replace(upstream_hint, "")

          if "supercell-2.0" in text:
              raise SystemExit("An obsolete supercell-2.0 ref remains in R/metacell.R")
          if text.count(new_ref) != 2:
              raise SystemExit("The valid Supercell2 ref was not written exactly twice")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit exact fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-supercell-ref.yml
          git add R/metacell.R
          git diff --cached --check
          git commit -m "Fix SuperCell2 install hints"
          git push origin HEAD:agent/fix-supercell2-install-ref
