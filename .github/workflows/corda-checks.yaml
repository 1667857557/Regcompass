name: CORDA2 exact-source checks

on:
  pull_request:
    paths:
      - 'R/layer2_corda*.R'
      - 'tests/corda-synthetic-check.R'
      - 'tests/corda-original-direction-check.R'
      - 'tests/corda-snow-namespace-check.R'
      - 'tests/corda-performance-check.R'
      - 'tests/corda-runtime-state-machine-check.R'
      - 'tests/corda2-python-reference-check.py'
      - 'tests/corda2-independent-source-audit.py'
      - 'tests/corda2-independent-source-audit.R'
      - 'tests/testthat/test-layer2-corda*.R'
      - '.github/workflows/corda-checks.yaml'
  push:
    branches: [Main]
    paths:
      - 'R/layer2_corda*.R'
      - 'tests/corda-synthetic-check.R'
      - 'tests/corda-original-direction-check.R'
      - 'tests/corda-snow-namespace-check.R'
      - 'tests/corda-performance-check.R'
      - 'tests/corda-runtime-state-machine-check.R'
      - 'tests/corda2-python-reference-check.py'
      - 'tests/corda2-independent-source-audit.py'
      - 'tests/corda2-independent-source-audit.R'
      - 'tests/testthat/test-layer2-corda*.R'
      - '.github/workflows/corda-checks.yaml'

permissions:
  contents: read

jobs:
  exact-corda2:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Python CORDA2 reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2'
          python -m pip install --no-deps 'git+https://github.com/resendislab/corda.git@c02e06d50606bf93f23d8f2e6d6ade0e996ca70e'
          python -m pip install 'cobra>=0.25,<0.32'

      - name: Run pinned Python source oracle
        run: python tests/corda2-python-reference-check.py

      - name: Derive independent Python source audit oracle
        run: python tests/corda2-independent-source-audit.py

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install minimal R solver dependencies
        shell: Rscript {0}
        run: |
          install.packages("highs")
          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            install.packages("BiocManager")
          }
          BiocManager::install("BiocParallel", ask = FALSE, update = FALSE)

      - name: Parse exact CORDA2 sources and checks
        shell: Rscript {0}
        run: |
          files <- c(
            "R/layer2_corda_evidence.R",
            "R/layer2_corda_lp.R",
            "R/layer2_corda_paper_contract.R",
            "R/layer2_corda_direction_contract.R",
            "R/layer2_corda_model.R",
            "R/layer2_corda_output_contract.R",
            "R/layer2_corda_target_contract.R",
            "R/layer2_corda_parent_contract.R",
            "R/layer2_corda2_algorithm.R",
            "R/layer2_corda2_algorithm_build.R",
            "R/layer2_corda2_algorithm_integration.R",
            "R/layer2_corda2_options_contract.R",
            "R/layer2_corda2_correction_contract.R",
            "R/layer2_corda2_output_contract.R",
            "R/layer2_corda_runtime.R",
            "R/layer2_corda_solver_contract.R",
            "R/layer2_corda_runtime_cache.R",
            "R/layer2_corda_runtime_step.R",
            "R/layer2_corda_pool_lifecycle.R",
            "R/layer2_corda2_public_contract.R",
            "tests/corda-synthetic-check.R",
            "tests/corda-original-direction-check.R",
            "tests/corda-snow-namespace-check.R",
            "tests/corda-performance-check.R",
            "tests/corda-runtime-state-machine-check.R",
            "tests/corda2-independent-source-audit.R"
          )
          for (file in files) parse(file = file)

      - name: Compare R output with Python oracle
        run: Rscript tests/corda-synthetic-check.R

      - name: Verify target-direction and fixed-parameter semantics
        run: Rscript tests/corda-original-direction-check.R

      - name: Verify independent Python and R source audit
        shell: Rscript {0}
        run: |
          rc_regcompass_step_layer2 <- function(...) NULL
          .rc_build_celltype_medium_union_gem_cache <- function(...) list()
          source("tests/corda2-independent-source-audit.R")

      - name: Verify sparse persistent updates and dynamic task scheduling
        run: Rscript tests/corda-performance-check.R

      - name: Compare full and sparse CORDA2 state machines
        run: Rscript tests/corda-runtime-state-machine-check.R

      - name: Verify installed SnowParam namespace and serial inner execution
        run: Rscript tests/corda-snow-namespace-check.R
