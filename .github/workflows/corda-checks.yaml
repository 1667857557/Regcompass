name: Original CORDA2 source checks

on:
  pull_request:
    paths:
      - 'R/layer2_corda*.R'
      - 'R/step_layer2.R'
      - 'R/celltype_union_gem_cache.R'
      - 'DESCRIPTION'
      - 'docs/tutorial-02-stepwise-audit.md'
      - 'tests/corda-synthetic-check.R'
      - 'tests/corda-stage-parallel-check.R'
      - 'tests/testthat/test-layer2-corda*.R'
      - '.github/workflows/corda-checks.yaml'
  push:
    branches: [Main]
    paths:
      - 'R/layer2_corda*.R'
      - 'R/step_layer2.R'
      - 'R/celltype_union_gem_cache.R'
      - 'DESCRIPTION'
      - 'docs/tutorial-02-stepwise-audit.md'
      - 'tests/corda-synthetic-check.R'
      - 'tests/corda-stage-parallel-check.R'
      - 'tests/testthat/test-layer2-corda*.R'
      - '.github/workflows/corda-checks.yaml'

permissions:
  contents: read

jobs:
  original-corda2:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install solver and parallel dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("highs", "BiocManager"))
          BiocManager::install("BiocParallel", ask = FALSE, update = FALSE)

      - name: Parse directly modified CORDA2 sources
        shell: Rscript {0}
        run: |
          files <- c(
            "R/layer2_corda_evidence.R",
            "R/layer2_corda_lp.R",
            "R/layer2_corda_paper_contract.R",
            "R/layer2_corda_direction_contract.R",
            "R/layer2_corda_model.R",
            "R/layer2_corda_output_contract.R",
            "R/layer2_corda_target_contract.R",
            "R/layer2_corda_parent_contract.R",
            "R/layer2_corda2_algorithm.R",
            "R/layer2_corda_serial_core.R",
            "R/layer2_corda_stage_parallel.R",
            "R/layer2_corda2_algorithm_build.R",
            "R/layer2_corda_dispatch.R",
            "R/layer2_corda2_options_contract.R",
            "R/layer2_corda_runtime.R",
            "R/layer2_corda_runtime_cache.R",
            "R/layer2_corda_runtime_step.R",
            "R/layer2_corda_pool_lifecycle.R",
            "tests/corda-synthetic-check.R",
            "tests/corda-stage-parallel-check.R"
          )
          for (file in files) parse(file = file)

      - name: Verify original serial CORDA2 source contract
        run: Rscript -e 'source("R/layer2_corda_stage_parallel.R"); source("R/layer2_corda_serial_core.R"); source("tests/corda-synthetic-check.R")'

      - name: Verify stage-parallel serial equivalence
        shell: bash
        run: |
          set +e
          Rscript tests/corda-stage-parallel-check.R > corda-stage-parallel.log 2>&1
          status=$?
          cat corda-stage-parallel.log
          echo "$status" > corda-stage-parallel.exit-code
          exit "$status"

      - name: Upload stage-parallel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corda-stage-parallel-diagnostics
          path: |
            corda-stage-parallel.log
            corda-stage-parallel.exit-code
          if-no-files-found: ignore
          retention-days: 3

      - name: Audit direct implementation and parameter surface
        run: |
          python - <<'PY'
          from pathlib import Path

          options = Path("R/layer2_corda2_options_contract.R").read_text()
          split = Path("R/layer2_corda_paper_contract.R").read_text()
          dependency = Path("R/layer2_corda2_algorithm.R").read_text()
          serial = Path("R/layer2_corda_serial_core.R").read_text()
          build = Path("R/layer2_corda2_algorithm_build.R").read_text()
          stage_parallel = Path("R/layer2_corda_stage_parallel.R").read_text()
          dispatch = Path("R/layer2_corda_dispatch.R").read_text()
          model = Path("R/layer2_corda_model.R").read_text()
          tutorial = Path("docs/tutorial-02-stepwise-audit.md").read_text()

          required_options = [
              '"MCxNCthresh"', '"constraint"', '"constrainby"',
              '"om"', '"ci"', 'args$MCxNCthresh %||% 2',
              'args$constraint %||% 1', 'args$constrainby %||% "val"',
              'args$om %||% 1e4', 'args$ci %||% 0.01',
          ]
          missing = [x for x in required_options if x not in options]
          if missing:
              raise RuntimeError(f"original CORDA2 option contract missing: {missing}")

          required_split = [
              'reaction_lb < 0 & reaction_ub >= 0',
              '_CORDA_rev_rxn', '.rc_corda2_close_opposite',
              '.rc_corda2_constrain_target',
          ]
          missing = [x for x in required_split if x not in split]
          if missing:
              raise RuntimeError(f"original CORDA2 direction contract missing: {missing}")

          required_dependency = [
              'sqrt(options$om)', '1 + options$ci',
              '.rc_corda2_constrain_target', 'options$flux_threshold',
          ]
          missing = [x for x in required_dependency if x not in dependency]
          if missing:
              raise RuntimeError(f"original CORDA2 dependency loop missing: {missing}")

          required_state = [
              'HCtoMC', 'HCtoNC', 'MCxNC', 'options$MCxNCthresh',
              'corda2_step2_2_MC_feasibility',
              'corda2_step3_HC_OT_dependencies',
              'original_matlab_directional_order',
          ]
          missing = [x for x in required_state if x not in serial]
          if missing:
              raise RuntimeError(f"preserved serial CORDA2 state machine missing: {missing}")
          missing = [x for x in required_state if x not in build]
          if missing:
              raise RuntimeError(f"stage-parallel CORDA2 state machine missing: {missing}")
          for marker in (
              '.rc_corda_stage_run',
              'stage_barrier_parallel_targets_deterministic_ordered_reduce',
          ):
              if marker not in build:
                  raise RuntimeError(f"stage-parallel CORDA2 build missing: {marker}")

          required_stage_parallel = [
              'completed=', 'remaining=', 'worker pool released',
              'threads=1', 'rc_parallel_lapply',
          ]
          missing = [x for x in required_stage_parallel if x not in stage_parallel]
          if missing:
              raise RuntimeError(f"CORDA2 stage-parallel runtime missing: {missing}")

          required_dispatch = [
              '.rc_corda_stage_parallel_requested',
              '.rc_corda_build_three_stage_serial_core',
              '.rc_corda_build_three_stage',
          ]
          missing = [x for x in required_dispatch if x not in dispatch]
          if missing:
              raise RuntimeError(f"CORDA2 serial/parallel dispatch missing: {missing}")

          required_direct = [
              '.rc_corda2_split_original', '.rc_corda_build_three_stage_dispatch',
              '.rc_corda2_apply_direction_bounds',
          ]
          missing = [x for x in required_direct if x not in model]
          if missing:
              raise RuntimeError(f"direct model integration missing: {missing}")
          for marker in ('_base <-', 'before_corda2', 'corda_like'):
              if marker in model:
                  raise RuntimeError(f"override or alternate algorithm marker remains: {marker}")

          if 'resendislab/corda' in tutorial or 'corda2_redundancies' in tutorial:
              raise RuntimeError("tutorial still documents the Python CORDA contract")
          for name in ('MCxNCthresh', 'constraint', 'constrainby', 'om', 'ci'):
              if name not in tutorial:
                  raise RuntimeError(f"tutorial does not describe {name}")
          PY
