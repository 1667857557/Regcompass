name: CORDA2 algorithm checks

on:
  pull_request:
    paths:
      - 'R/layer2_corda*.R'
      - 'tests/corda-synthetic-check.R'
      - 'tests/corda-original-direction-check.R'
      - 'tests/corda-snow-namespace-check.R'
      - 'tests/corda2-python-reference-check.py'
      - '.github/workflows/corda-checks.yaml'
  push:
    branches: [Main]
    paths:
      - 'R/layer2_corda*.R'
      - 'tests/corda-synthetic-check.R'
      - 'tests/corda-original-direction-check.R'
      - 'tests/corda-snow-namespace-check.R'
      - 'tests/corda2-python-reference-check.py'
      - '.github/workflows/corda-checks.yaml'

permissions:
  contents: read

jobs:
  synthetic-corda2:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Python CORDA2 reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2"
          python -m pip install "git+https://github.com/resendislab/corda.git@c02e06d50606bf93f23d8f2e6d6ade0e996ca70e"
      - name: Run pinned Python CORDA2 reference checks
        run: python tests/corda2-python-reference-check.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true
      - name: Install minimal R solver dependencies
        shell: Rscript {0}
        run: |
          install.packages("highs")
          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            install.packages("BiocManager")
          }
          BiocManager::install("BiocParallel", ask = FALSE, update = FALSE)
      - name: Parse CORDA2 sources
        shell: Rscript {0}
        run: |
          files <- c(
            "R/layer2_corda_evidence.R",
            "R/layer2_corda_lp.R",
            "R/layer2_corda_paper_contract.R",
            "R/layer2_corda_direction_contract.R",
            "R/layer2_corda_model.R",
            "R/layer2_corda_output_contract.R",
            "R/layer2_corda_target_contract.R",
            "R/layer2_corda_parent_contract.R",
            "R/layer2_corda2_algorithm.R",
            "R/layer2_corda2_options_contract.R",
            "R/layer2_corda2_correction_contract.R",
            "R/layer2_corda2_output_contract.R",
            "R/layer2_corda_runtime.R",
            "R/layer2_corda_pool_lifecycle.R",
            "R/layer2_corda2_public_contract.R",
            "tests/corda-synthetic-check.R",
            "tests/corda-original-direction-check.R",
            "tests/corda-snow-namespace-check.R"
          )
          for (file in files) parse(file = file)
      - name: Run corrected R CORDA2 synthetic checks
        run: Rscript tests/corda-synthetic-check.R
      - name: Run signed-direction correction check
        run: Rscript tests/corda-original-direction-check.R
      - name: Run CORDA2 SnowParam package-namespace check
        run: Rscript tests/corda-snow-namespace-check.R
