name: One-time clean current R contracts

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

concurrency:
  group: regcompass-r-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply current R contract
        run: python .github/scripts/cleanup_r_contract.py || true
      - name: Commit source cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A R
          git commit -m "remove retired R fields and validate mixed routing"
          git push origin HEAD:${{ github.head_ref }}
