name: One-time finalize repository cleanup

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

concurrency:
  group: regcompass-final-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Simplify documentation and checks
        run: python .github/scripts/final_cleanup.py || true
      - name: Commit final cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "simplify documentation and package checks"
          git push origin HEAD:${{ github.head_ref }}
