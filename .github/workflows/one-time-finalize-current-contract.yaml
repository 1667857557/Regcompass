name: One-time apply cell-type Pando routing

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

concurrency:
  group: regcompass-celltype-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply cell-type routing
        run: python .github/scripts/apply_mixed_pando.py || true
      - name: Commit routed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A R DESCRIPTION
          git commit -m "route Pando by retained condition count"
          git push origin HEAD:${{ github.head_ref }}
