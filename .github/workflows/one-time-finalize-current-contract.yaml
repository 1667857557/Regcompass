name: One-time finalize current RegCompass contract

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

concurrency:
  group: regcompass-current-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Add detailed post-migration diagnostics
        run: python .github/scripts/patch_finalizer_audit.py
      - name: Apply current source, API, tutorial and test contract
        run: python .github/scripts/finalize_current_contract.py
      - name: Parse all R and test sources
        shell: Rscript {0}
        run: |
          files <- c(
            list.files("R", pattern = "[.]R$", full.names = TRUE),
            list.files("tests/testthat", pattern = "[.]R$", full.names = TRUE)
          )
          for (file in files) {
            tryCatch(
              parse(file = file),
              error = function(error) stop(
                file, ": ", conditionMessage(error), call. = FALSE
              )
            )
          }
      - name: Verify current API and documentation references
        shell: python
        run: |
          from pathlib import Path
          import re
          source_files = sorted(Path("R").glob("*.R"))
          source = "\n".join(path.read_text() for path in source_files)
          current_docs = [Path("README.md")]
          for root in (Path("docs"), Path("vignettes"), Path("man")):
              current_docs.extend(
                  path for path in root.rglob("*")
                  if path.is_file() and path.suffix.lower() in
                  {".md", ".rmd", ".rd"}
              )
          docs = "\n".join(path.read_text() for path in current_docs)
          retired = [
              "condition_full_oof", "common_oof", "condition_unique_oof",
              "project_condition_grn_primary_cells",
              "min_abs_estimate", "min_model_rsq",
              "structural_zero_probability", "nested_cv_used",
              "projection_component", "comparison_support",
              "regulatory_alpha",
          ]
          present = [token for token in retired
                     if token in source or token in docs]
          if present:
              raise RuntimeError(f"retired current API remains: {present}")
          pattern = re.compile(
              r"(?m)^([A-Za-z.][A-Za-z0-9._]*)\s*<-\s*function\b"
          )
          definitions = {}
          for path in source_files:
              for name in pattern.findall(path.read_text()):
                  definitions.setdefault(name, []).append(str(path))
          duplicate = {
              name: paths for name, paths in definitions.items()
              if len(paths) > 1
          }
          if duplicate:
              raise RuntimeError(f"duplicate functions: {duplicate}")
          required = [
              "regcompass_regulatory_layer1_v4",
              "regcompass_regulatory_layer2_v3",
              "gene_projection = projection$projection",
              "reaction_regulatory_support_fraction",
              'primary = "penalty"',
              'rna_control = "penalty_rna_only"',
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise RuntimeError(f"current contract missing: {missing}")
      - name: Commit source, tutorials and tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A R DESCRIPTION README.md docs vignettes man tests
          git commit -m "remove obsolete APIs and align current tutorials"
          git push origin HEAD:${{ github.head_ref }}
