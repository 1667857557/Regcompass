name: One-time finalize current RegCompass contract

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

concurrency:
  group: regcompass-current-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply current source and documentation contract
        run: python .github/scripts/finalize_current_contract.py || true
      - name: Commit migrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A R DESCRIPTION README.md docs vignettes man tests
          git commit -m "remove obsolete APIs and align current tutorials"
          git push origin HEAD:${{ github.head_ref }}
