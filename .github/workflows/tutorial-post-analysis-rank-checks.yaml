name: Post-analysis reaction rank checks

on:
  pull_request:
    paths:
      - 'R/reaction_rank_plot.R'
      - 'R/workflow_utils.R'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'man/plot_top_celltype_reaction_rank.Rd'
      - 'docs/tutorial-04-post-analysis.md'
      - 'tests/tutorial-post-analysis-rank-check.R'
      - '.github/workflows/tutorial-post-analysis-rank-checks.yaml'
  push:
    branches: [Main]
    paths:
      - 'R/reaction_rank_plot.R'
      - 'R/workflow_utils.R'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'man/plot_top_celltype_reaction_rank.Rd'
      - 'docs/tutorial-04-post-analysis.md'
      - 'tests/tutorial-post-analysis-rank-check.R'
      - '.github/workflows/tutorial-post-analysis-rank-checks.yaml'

permissions:
  contents: read

jobs:
  reaction-rank:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install plotting dependency
        shell: Rscript {0}
        run: install.packages('ggplot2')

      - name: Parse implementation and tutorial code blocks
        shell: Rscript {0}
        run: |
          parse(file = 'R/reaction_rank_plot.R')
          parse(file = 'R/workflow_utils.R')
          lines <- readLines('docs/tutorial-04-post-analysis.md', warn = FALSE)
          starts <- which(trimws(lines) == '```r')
          ends <- which(trimws(lines) == '```')
          stopifnot(length(starts) > 0L)
          for (start in starts) {
            finish <- ends[ends > start][1L]
            if (is.na(finish)) stop('Unclosed R code block at line ', start)
            parse(text = lines[seq.int(start + 1L, finish - 1L)])
          }

      - name: Run synthetic rank and condition regressions
        run: Rscript tests/tutorial-post-analysis-rank-check.R

      - name: Audit exported rank semantics
        shell: python
        run: |
          from pathlib import Path

          source = Path('R/reaction_rank_plot.R').read_text()
          namespace = Path('NAMESPACE').read_text()
          description = Path('DESCRIPTION').read_text()
          documentation = Path('man/plot_top_celltype_reaction_rank.Rd').read_text()
          tutorial = Path('docs/tutorial-04-post-analysis.md').read_text()
          required_source = [
              'plot_top_celltype_reaction_rank <- function(',
              'top_n = 20L',
              'median_support_score',
              'has_active_multiome_contribution',
              'Multiome-supported',
              'RNA-only',
              'reaction_name',
              'forward_formula',
              'reverse_formula',
              'duplicate_label',
              'ggplot2::geom_col',
              'ggplot2::coord_flip',
              'attr(plot, "rank_data")',
              'condition_available',
              'no usable condition metadata',
          ]
          missing = [value for value in required_source if value not in source]
          if missing:
              raise RuntimeError(f'exported rank implementation missing: {missing}')

          required_registration = [
              ('NAMESPACE', 'export(plot_top_celltype_reaction_rank)', namespace),
              ('DESCRIPTION', "'reaction_rank_plot.R'", description),
              ('Rd', '\\alias{plot_top_celltype_reaction_rank}', documentation),
              ('tutorial', 'plot_top_celltype_reaction_rank(', tutorial),
          ]
          missing_registration = [
              f'{name}: {value}'
              for name, value, text in required_registration
              if value not in text
          ]
          if missing_registration:
              raise RuntimeError(
                  f'exported rank registration missing: {missing_registration}'
              )

          forbidden = [
              'regulatory_support_fraction > 0',
              'regulatory_penalty_delta != 0',
              'evidence_class == "RNA+ATAC"[1]',
          ]
          found = [value for value in forbidden if value in source]
          if found:
              raise RuntimeError(f'unsupported evidence shortcut found: {found}')
