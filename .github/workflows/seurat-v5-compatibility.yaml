name: Seurat v5 compatibility

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  seurat-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libglpk-dev \
            libgsl-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev

      - name: Install latest Seurat v5 stack and package dependencies
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          options(timeout = 1200)
          install.packages(c(
            "Matrix", "matrixStats", "testthat", "highs",
            "BiocManager", "remotes"
          ))
          BiocManager::install(
            c(
              "BiocGenerics", "S4Vectors", "IRanges", "GenomeInfoDb",
              "GenomicRanges", "sparseMatrixStats", "MatrixGenerics",
              "limma", "Rhtslib", "Rsamtools", "TFBSTools", "motifmatchr"
            ),
            ask = FALSE,
            update = FALSE
          )
          remotes::install_version(
            "SeuratObject", version = "5.4.0",
            dependencies = NA, upgrade = "never"
          )
          remotes::install_version(
            "Seurat", version = "5.5.0",
            dependencies = NA, upgrade = "never"
          )
          remotes::install_version(
            "Signac", version = "1.17.1",
            dependencies = NA, upgrade = "never"
          )
          remotes::install_github(
            paste0(
              "1667857557/SuperCell_Seurat_V4@",
              "1319730b15857d88f169a9006f6cf4e88993c0c7"
            ),
            dependencies = NA,
            upgrade = "never",
            auth_token = Sys.getenv("GITHUB_PAT")
          )
          remotes::install_github(
            paste0(
              "1667857557/Pando_regcompass@",
              "7d7f67f0f9fbd67e76e09fde13387696d41c82ab"
            ),
            dependencies = NA,
            upgrade = "never",
            auth_token = Sys.getenv("GITHUB_PAT")
          )
          expected <- c(
            SeuratObject = "5.4.0",
            Seurat = "5.5.0",
            Signac = "1.17.1"
          )
          observed <- vapply(
            names(expected),
            function(package) as.character(packageVersion(package)),
            character(1)
          )
          if (!identical(observed, expected)) {
            stop(
              "Unexpected Seurat v5 stack: ",
              paste(names(observed), observed, sep = "=", collapse = ", ")
            )
          }
          if (packageVersion("Pando") < package_version("1.5.0")) {
            stop("Pando >= 1.5.0 is required")
          }
          stopifnot(
            is.function(Pando::infer_condition_grn),
            is.function(Pando::condition_grn_fit),
            is.function(Pando::project_condition_grn_primary_cells),
            is.function(SuperCell::SCimplify_by_graph_group_from_embedding),
            all(
              c("backend", "verified_estimability_mask") %in%
                names(formals(Pando:::.condition_fit_multitask_path))
            ),
            all(
              c("cache", "estimability_verified", "solver") %in%
                names(formals(Pando:::.condition_refit_shared_baseline))
            )
          )

      - name: Install RegCompassR
        shell: bash
        run: |
          R CMD INSTALL --no-multiarch --with-keep.source --install-tests .

      - name: Run Seurat, Pando, and SuperCell compatibility tests
        shell: Rscript {0}
        run: |
          library(RegCompassR)
          library(Pando)
          profile <- RegCompassR:::.rc_validate_seurat_stack_versions(
            RegCompassR:::.rc_seurat_stack_versions()
          )
          stopifnot(identical(profile$profile, "seurat_v5_compatible"))
          stopifnot(is.function(Pando::LayerData))

          old_option <- getOption("Seurat.object.assay.version")
          on.exit(options(Seurat.object.assay.version = old_option), add = TRUE)
          options(Seurat.object.assay.version = "v3")
          counts <- Matrix::Matrix(
            matrix(c(1, 0, 2, 3, 0, 1, 4, 0), nrow = 2),
            sparse = TRUE,
            dimnames = list(c("g1", "g2"), paste0("cell", 1:4))
          )
          object <- Seurat::CreateSeuratObject(counts = counts)
          stopifnot(!inherits(object[["RNA"]], "Assay5"))
          stopifnot(isTRUE(all.equal(
            as.matrix(SuperCell:::.sc_get_assay_data(
              object, assay = "RNA", slot = "counts"
            )),
            as.matrix(counts)
          )))
          peaks <- Matrix::Matrix(
            matrix(c(1, 0, 0, 2, 0, 3, 1, 0), nrow = 2),
            sparse = TRUE,
            dimnames = list(c("chr1-1-10", "chr1-20-30"), colnames(counts))
          )
          object[["ATAC"]] <- Signac::CreateChromatinAssay(
            counts = peaks,
            sep = c("-", "-")
          )
          stopifnot(isTRUE(all.equal(
            as.matrix(SuperCell:::.sc_get_assay_data(
              object, assay = "ATAC", slot = "counts"
            )),
            as.matrix(peaks)
          )))

          cell_ids <- paste0("x", seq_len(12))
          embedding <- rbind(
            c(0, 0), c(0.01, 0), c(1, 0), c(1.01, 0), c(2, 0), c(2.01, 0),
            c(0, 0.001), c(0.01, 0.001), c(1, 0.001), c(1.01, 0.001),
            c(2, 0.001), c(2.01, 0.001)
          )
          rownames(embedding) <- cell_ids
          graph_group <- stats::setNames(rep(c("A", "B"), each = 6), cell_ids)
          condition <- stats::setNames(rep(c("C", "D"), 6), cell_ids)
          graph_result <- SuperCell::SCimplify_by_graph_group_from_embedding(
            X = embedding,
            cell.graph.group = graph_group,
            cell.split.condition = condition,
            gamma = 2,
            k.knn = 1,
            n.pc = c(2, 1),
            return.singlecell.NW = TRUE,
            return.hierarchical.structure = FALSE
          )
          stopifnot(
            identical(graph_result$n.pc, c(2L, 1L)),
            identical(
              graph_result$graph_scope,
              "independent_by_cell.graph.group"
            ),
            identical(
              graph_result$condition_scope,
              "joint_within_graph_group_then_membership_split"
            ),
            isTRUE(graph_result$graph_supercells_available)
          )
          membership_groups <- split(
            names(graph_result$membership), graph_result$membership
          )
          stopifnot(all(vapply(membership_groups, function(ids) {
            length(unique(graph_group[ids])) == 1L &&
              length(unique(condition[ids])) == 1L
          }, logical(1))))
          supercell_vertices <- as.character(
            igraph::V(graph_result$graph.supercells)$name
          )
          stopifnot(
            !anyDuplicated(supercell_vertices),
            setequal(supercell_vertices, names(membership_groups)),
            setequal(names(graph_result$supercell_size), names(membership_groups))
          )
          edges <- igraph::as_edgelist(
            graph_result$graph.singlecell, names = TRUE
          )
          stopifnot(
            all(graph_group[edges[, 1]] == graph_group[edges[, 2]])
          )
          cross_condition_edges <- sum(
            condition[edges[, 1]] != condition[edges[, 2]]
          )
          stopifnot(
            is.numeric(cross_condition_edges),
            cross_condition_edges >= 0L
          )

          testthat::set_max_fails(Inf)
          reporter <- testthat::SummaryReporter$new(max_reports = Inf)
          testthat::test_local(
            Sys.getenv("GITHUB_WORKSPACE"),
            filter = "seurat-compatibility",
            reporter = reporter,
            load_package = "installed",
            stop_on_failure = TRUE,
            stop_on_warning = FALSE
          )
