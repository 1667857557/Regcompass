name: Seurat v5 compatibility

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  seurat-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libglpk-dev \
            libgsl-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev

      - name: Install Seurat v5 stack and companion packages
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          options(timeout = 1200)
          install.packages(c(
            "Matrix", "matrixStats", "testthat", "highs",
            "BiocManager", "remotes", "igraph"
          ))
          BiocManager::install(
            c(
              "BiocGenerics", "S4Vectors", "IRanges", "GenomeInfoDb",
              "GenomicRanges", "sparseMatrixStats", "MatrixGenerics",
              "limma", "Rhtslib", "Rsamtools", "TFBSTools", "motifmatchr"
            ),
            ask = FALSE,
            update = FALSE
          )
          remotes::install_version(
            "SeuratObject", version = "5.4.0",
            dependencies = NA, upgrade = "never"
          )
          remotes::install_version(
            "Seurat", version = "5.5.0",
            dependencies = NA, upgrade = "never"
          )
          remotes::install_version(
            "Signac", version = "1.17.1",
            dependencies = NA, upgrade = "never"
          )
          remotes::install_github(
            "1667857557/SuperCell_Seurat_V4@agent/canonical-celltype-wnn-metacells",
            dependencies = NA,
            upgrade = "never",
            auth_token = Sys.getenv("GITHUB_PAT")
          )
          remotes::install_github(
            "1667857557/Pando_regcompass@agent/high-p-memory-bounded-engine",
            dependencies = NA,
            upgrade = "never",
            auth_token = Sys.getenv("GITHUB_PAT")
          )
          expected <- c(
            SeuratObject = "5.4.0",
            Seurat = "5.5.0",
            Signac = "1.17.1"
          )
          observed <- vapply(
            names(expected),
            function(package) as.character(packageVersion(package)),
            character(1)
          )
          stopifnot(identical(observed, expected))
          stopifnot(
            packageVersion("Pando") >= package_version("1.6.3"),
            is.function(Pando::infer_condition_grn),
            is.function(Pando::condition_grn_fit),
            is.function(Pando::project_condition_grn_primary_cells),
            is.function(SuperCell::SCimplify_by_graph_group),
            identical(eval(formals(SuperCell::SCimplify_for_Seurat)$gamma), 30),
            identical(eval(formals(SuperCell::SCimplify_by_graph_group)$gamma), 30),
            !("SCimplify_by_graph_group_from_embedding" %in%
              getNamespaceExports("SuperCell"))
          )

      - name: Install RegCompassR
        shell: bash
        run: |
          R CMD INSTALL --no-multiarch --with-keep.source --install-tests .

      - name: Validate grouped WNN and Seurat v5 contracts
        shell: Rscript {0}
        run: |
          library(RegCompassR)
          library(Pando)
          library(SuperCell)
          library(Seurat)
          library(Signac)

          profile <- RegCompassR:::.rc_validate_seurat_stack_versions(
            RegCompassR:::.rc_seurat_stack_versions()
          )
          stopifnot(identical(profile$profile, "seurat_v5_compatible"))
          stopifnot(is.function(Pando::LayerData))
          stopifnot(identical(
            RegCompassR:::.rc_condition_metacell_defaults()$gamma,
            30L
          ))

          old_option <- getOption("Seurat.object.assay.version")
          on.exit(options(Seurat.object.assay.version = old_option), add = TRUE)
          options(Seurat.object.assay.version = "v3")

          set.seed(11)
          cells <- paste0("cell", seq_len(12))
          rna <- Matrix::Matrix(
            matrix(seq_len(48), nrow = 4), sparse = TRUE,
            dimnames = list(paste0("g", 1:4), cells)
          )
          atac <- Matrix::Matrix(
            matrix(rev(seq_len(48)), nrow = 4), sparse = TRUE,
            dimnames = list(paste0("chr1-", seq(1, 31, 10), "-", seq(10, 40, 10)), cells)
          )
          object <- CreateSeuratObject(counts = rna)
          object[["ATAC"]] <- CreateChromatinAssay(counts = atac, sep = c("-", "-"))
          object[["pca"]] <- CreateDimReducObject(
            embeddings = matrix(
              stats::rnorm(length(cells) * 4L), nrow = length(cells),
              dimnames = list(cells, paste0("PC_", 1:4))
            ),
            key = "PC_", assay = "RNA"
          )
          object[["lsi"]] <- CreateDimReducObject(
            embeddings = matrix(
              stats::rnorm(length(cells) * 4L), nrow = length(cells),
              dimnames = list(cells, paste0("LSI_", 1:4))
            ),
            key = "LSI_", assay = "ATAC"
          )
          graph_group <- stats::setNames(rep(c("A", "B"), each = 6), cells)
          condition <- stats::setNames(rep(c("C", "D"), 6), cells)
          graph_result <- SuperCell::SCimplify_by_graph_group(
            seurat = object,
            cell.graph.group = graph_group,
            cell.split.condition = condition,
            assay = c("RNA", "ATAC"),
            reduction = list("pca", "lsi"),
            dims = list(1:4, 1:4),
            gamma = 2,
            # Seurat drops the self-neighbour before applying row-wise SD;
            # k.nn >= 3 preserves a two-dimensional distance matrix.
            k.knn = 3,
            seed = 11
          )
          membership_groups <- split(
            names(graph_result$membership), graph_result$membership
          )
          stopifnot(
            identical(
              graph_result$graph_scope,
              "independent_WNN_by_cell.graph.group"
            ),
            identical(
              graph_result$condition_scope,
              "joint_within_graph_group_then_membership_split"
            ),
            identical(
              graph_result$modality_weighting,
              "adaptive_WNN_within_graph_group"
            ),
            all(vapply(membership_groups, function(ids) {
              length(unique(graph_group[ids])) == 1L &&
                length(unique(condition[ids])) == 1L
            }, logical(1)))
          )

          testthat::set_max_fails(Inf)
          reporter <- testthat::SummaryReporter$new(max_reports = Inf)
          testthat::test_local(
            Sys.getenv("GITHUB_WORKSPACE"),
            filter = "seurat-compatibility|companion-package-contract|stage-io-contracts",
            reporter = reporter,
            load_package = "installed",
            stop_on_failure = TRUE,
            stop_on_warning = FALSE
          )
