name: numerical-runtime-contract

on:
  pull_request:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-r45-matrix17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::remotes
          dependencies: '"hard"'
      - name: Pin Matrix 1.7-4
        shell: Rscript {0}
        run: |
          remotes::install_version(
            "Matrix", version = "1.7-4",
            repos = "https://cloud.r-project.org",
            upgrade = "never"
          )
          stopifnot(as.character(packageVersion("Matrix")) == "1.7.4")
      - name: Install latest Pando native runtime
        shell: Rscript {0}
        run: |
          remotes::install_github(
            "1667857557/Pando_regcompass",
            ref = "HEAD",
            dependencies = NA,
            upgrade = "never",
            force = TRUE,
            build_vignettes = FALSE
          )
          stopifnot(
            utils::compareVersion(
              as.character(packageVersion("Pando")), "1.5.1"
            ) >= 0L
          )
      - name: Install RegCompassR
        run: R CMD INSTALL . --no-multiarch --with-keep.source
      - name: Verify latest companion ABI and targeted regressions
        shell: Rscript {0}
        run: |
          library(Pando)
          library(RegCompassR)
          library(testthat)
          stopifnot(
            utils::compareVersion(
              as.character(packageVersion("Pando")), "1.5.1"
            ) >= 0L
          )
          stopifnot(as.character(packageVersion("RegCompassR")) == "2.2.3")
          stopifnot(as.character(packageVersion("Matrix")) == "1.7.4")
          stopifnot(is.loaded(
            "_Pando_condition_product_matrix_cpp", PACKAGE = "Pando"
          ))
          stopifnot(is.loaded(
            "_Pando_condition_fit_multitask_path_cpp", PACKAGE = "Pando"
          ))
          stopifnot(!exists(
            ".condition_product_matrix_r",
            envir = asNamespace("Pando"),
            inherits = FALSE
          ))
          test_file("tests/testthat/test-native-supercell-standard-pando.R")
          test_file("tests/testthat/test-v210-oof-biological-contract.R")
          test_file("tests/testthat/test-vmax-cache.R")
          sessionInfo()
