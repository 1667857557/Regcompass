name: Direct medium core refactor

on:
  push:
    branches:
      - agent/fix-target-metacell-medium-contracts

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-target-metacell-medium-contracts
          fetch-depth: 0

      - name: Move validated medium semantics into canonical definitions
        shell: python
        run: |
          from pathlib import Path

          def extract(text, start, end):
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b].rstrip() + "\n\n"

          def replace(text, start, end, replacement):
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement.rstrip() + "\n\n" + text[b:]

          medium_path = Path("R/medium.R")
          semantics_path = Path("R/compass_medium_semantics.R")
          full_path = Path("R/full_gem.R")
          description_path = Path("DESCRIPTION")

          medium = medium_path.read_text()
          semantics = semantics_path.read_text()
          full = full_path.read_text()
          description = description_path.read_text()

          apply_impl = extract(
              semantics,
              ".rc_apply_compass_medium_constraints <- function(",
              ".rc_make_compass_model_bound_medium <- function("
          ).replace(
              ".rc_apply_compass_medium_constraints <- function(",
              "rc_apply_medium_constraints <- function(", 1
          )
          apply_doc = '''#' Apply COMPASS-style medium constraints without expanding GEM directionality
#'
#' Exchange uptake directions are inferred from exchange stoichiometry. The
#' baseline applies a uniform uptake cap while preserving originally permitted
#' secretion. Explicit medium rows then restrict the corresponding exchange
#' direction; no row can open a direction blocked by the parent GEM.
#'
#' @param gem A validated RegCompass GEM.
#' @param medium_table Medium rows from `rc_make_medium_scenarios()`.
#' @param condition Optional condition selector.
#' @param exchange_default_lb Legacy non-positive uptake-cap control. Prefer
#'   `exchange_limit`; zero selects the closed unlisted policy only when
#'   `unlisted_policy` is omitted.
#' @param exchange_default_ub Optional secretion cap; `Inf` preserves the parent
#'   GEM secretion bound.
#' @param allow_secretion Preserve an originally permitted secretion direction.
#' @param strict Stop for unknown/non-exchange IDs or unresolved exchange
#'   orientation.
#' @param exchange_limit Non-negative COMPASS uptake cap for exchange reactions.
#' @param unlisted_policy `"compass"` keeps model-defined uptake with the uniform
#'   cap; `"closed"` closes uptake for unlisted exchanges.
#' @return A list with the constrained GEM and bound diagnostics.
'''
          medium = replace(
              medium,
              "#' Apply medium constraints without expanding GEM directionality",
              "#' Build literature-backed extracellular medium scenarios",
              apply_doc + apply_impl
          )

          model_impl = extract(
              semantics,
              ".rc_make_compass_model_bound_medium <- function(",
              ".rc_assert_compass_medium_bounds_only <- function("
          ).replace(
              ".rc_make_compass_model_bound_medium <- function(",
              ".rc_compass_model_bound_medium <- function(", 1
          )
          medium = replace(
              medium,
              ".rc_compass_model_bound_medium <- function(",
              ".rc_build_medium_preset <- function(",
              model_impl
          )

          assert_impl = extract(
              semantics,
              ".rc_assert_compass_medium_bounds_only <- function(",
              ".rc_compass_medium_fingerprint <- function("
          ).replace(
              ".rc_assert_compass_medium_bounds_only <- function(",
              ".rc_assert_medium_bounds_only <- function(", 1
          )
          full = replace(
              full,
              ".rc_assert_medium_bounds_only <- function(",
              "#' Build a COMPASS-style full GEM for one medium scenario",
              assert_impl
          )

          low_level = semantics[:semantics.index(
              ".rc_apply_compass_medium_constraints <- function("
          )].rstrip() + "\n"
          old_header = '''# COMPASS-compatible extracellular exchange-bound semantics -----------------
#
# COMPASS first applies a uniform cap to the uptake direction of every
# exchange reaction, preserves the secretion direction, and then lets explicit
# medium entries override the uptake cap. A reaction omitted from the medium
# therefore retains the capped model-defined uptake direction instead of being
# closed. This file is collated after the legacy medium implementation and
# installs the corrected semantics without changing the public medium table or
# Layer 2 interfaces.
'''
          new_header = '''# Low-level COMPASS extracellular-bound helpers -------------------------------
#
# Canonical public/core medium functions are defined directly in R/medium.R and
# R/full_gem.R. This file contains only shared low-level exchange-direction and
# bound helpers; it never replaces functions by collation order.
'''
          if old_header in low_level:
              low_level = low_level.replace(old_header, new_header, 1)
          semantics = low_level

          old_collate = "    'medium.R'\n    'published_medium_contract.R'\n    'compass_medium_semantics.R'\n"
          new_collate = "    'compass_medium_semantics.R'\n    'medium.R'\n    'published_medium_contract.R'\n"
          if old_collate not in description:
              raise RuntimeError("Expected medium Collate block was not found")
          description = description.replace(old_collate, new_collate, 1)

          forbidden = [
              "rc_apply_medium_constraints <- .rc_apply_compass_medium_constraints",
              ".rc_compass_model_bound_medium <- .rc_make_compass_model_bound_medium",
              ".rc_assert_medium_bounds_only <- .rc_assert_compass_medium_bounds_only",
              ".rc_full_gem_medium_fingerprint <- .rc_compass_medium_fingerprint",
          ]
          combined = medium + "\n" + semantics + "\n" + full
          found = [x for x in forbidden if x in combined]
          if found:
              raise RuntimeError(f"Post-collation function replacement remains: {found}")
          for required in (
              "rc_apply_medium_constraints <- function(",
              ".rc_compass_model_bound_medium <- function(",
              ".rc_assert_medium_bounds_only <- function(",
              "compass_uptake_cap_then_explicit_directional_overrides",
              "changed_unlisted_exchange_reactions",
          ):
              if required not in combined:
                  raise RuntimeError(f"Canonical medium implementation missing: {required}")

          medium_path.write_text(medium)
          semantics_path.write_text(semantics)
          full_path.write_text(full)
          description_path.write_text(description)

      - name: Parse modified R sources
        shell: Rscript {0}
        run: |
          for (file in c("R/compass_medium_semantics.R", "R/medium.R", "R/full_gem.R")) parse(file = file)

      - name: Commit direct refactor
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/compass_medium_semantics.R R/medium.R R/full_gem.R DESCRIPTION
          git commit -m "Refactor medium semantics into original functions"
          git push origin HEAD:agent/fix-target-metacell-medium-contracts
