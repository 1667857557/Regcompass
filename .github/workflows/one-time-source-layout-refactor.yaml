name: One-time source layout refactor

on:
  push:
    branches:
      - agent/common-dictionary-condition-grn

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/common-dictionary-condition-grn
          fetch-depth: 0
      - name: Integrate target-union definitions
        shell: python
        run: |
          import pathlib, re

          root = pathlib.Path('.')
          scoring_path = root / 'R' / 'target_union.R'
          definition_path = root / 'R' / 'target_union_anchors.R'
          description_path = root / 'DESCRIPTION'

          if not definition_path.exists():
              raise SystemExit('target_union_anchors.R is already absent')

          def function_span(text, name):
              pattern = re.compile(
                  rf'(?m)^{re.escape(name)}\s*<-\s*function\s*\('
              )
              match = pattern.search(text)
              if match is None:
                  raise RuntimeError(f'Function not found: {name}')
              brace = text.find('{', match.end())
              if brace < 0:
                  raise RuntimeError(f'Opening brace not found: {name}')
              depth = 0
              quote = None
              escaped = False
              comment = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if comment:
                      if ch == '\n':
                          comment = False
                      i += 1
                      continue
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '#':
                      comment = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(text) and text[end] in ' \t':
                              end += 1
                          while end < len(text) and text[end] == '\n':
                              end += 1
                          return match.start(), end
                  i += 1
              raise RuntimeError(f'Function did not close: {name}')

          scoring = scoring_path.read_text()
          definitions = definition_path.read_text()

          core_start, core_end = function_span(
              definitions, '.rc_target_union_core_rows'
          )
          build_start, build_end = function_span(
              definitions, '.rc_build_target_union_definition'
          )
          core_function = definitions[core_start:core_end].rstrip() + '\n\n'
          build_function = definitions[build_start:build_end].rstrip() + '\n\n'

          old_start, old_end = function_span(
              scoring, '.rc_build_target_union_definition'
          )
          scoring = scoring[:old_start] + scoring[old_end:]

          normalize_start, normalize_end = function_span(
              scoring, '.rc_target_union_normalize_ids'
          )
          insertion = core_function + build_function
          scoring = scoring[:normalize_end] + insertion + scoring[normalize_end:]
          scoring_path.write_text(scoring)

          definition_path.unlink()
          description = description_path.read_text()
          description = description.replace("    'target_union_anchors.R'\n", '')
          description_path.write_text(description)

          definitions_by_name = {}
          function_pattern = re.compile(
              r'(?m)^([A-Za-z.][A-Za-z0-9._]*)\s*<-\s*function\b'
          )
          for path in sorted((root / 'R').glob('*.R')):
              for match in function_pattern.finditer(path.read_text()):
                  definitions_by_name.setdefault(match.group(1), []).append(
                      str(path)
                  )
          duplicate = {
              name: paths for name, paths in definitions_by_name.items()
              if len(paths) > 1
          }
          if duplicate:
              raise RuntimeError(f'Duplicate function definitions: {duplicate}')

          if list((root / 'R').glob('zzz*.R')):
              raise RuntimeError('Late-loaded zzz source file remains')
          if 'target_union_anchors.R' in description_path.read_text():
              raise RuntimeError('DESCRIPTION still collates target_union_anchors.R')
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add R/target_union.R R/target_union_anchors.R DESCRIPTION
          git commit -m "integrate target union definitions directly"
          git push origin HEAD:agent/common-dictionary-condition-grn
