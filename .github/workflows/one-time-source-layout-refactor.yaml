name: One-time source layout refactor

on:
  pull_request:
    branches: [Main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Consolidate duplicate definitions
        shell: python
        run: |
          import pathlib, re

          root = pathlib.Path('.')
          rdir = root / 'R'
          description_path = root / 'DESCRIPTION'

          def function_span(text, name):
              pattern = re.compile(
                  rf'(?m)^{re.escape(name)}\s*<-\s*function\s*\('
              )
              match = pattern.search(text)
              if match is None:
                  raise RuntimeError(f'Function not found: {name}')
              brace = text.find('{', match.end())
              if brace < 0:
                  raise RuntimeError(f'Opening brace not found: {name}')
              depth = 0
              quote = None
              escaped = False
              comment = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if comment:
                      if ch == '\n':
                          comment = False
                      i += 1
                      continue
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '#':
                      comment = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(text) and text[end] in ' \t':
                              end += 1
                          while end < len(text) and text[end] == '\n':
                              end += 1
                          return match.start(), end
                  i += 1
              raise RuntimeError(f'Function did not close: {name}')

          def roxygen_start(text, start):
              line_start = text.rfind('\n', 0, start) + 1
              lines = text[:line_start].splitlines(keepends=True)
              index = len(lines)
              saw_roxygen = False
              while index > 0:
                  stripped = lines[index - 1].strip()
                  if stripped.startswith("#'"):
                      saw_roxygen = True
                      index -= 1
                      continue
                  if saw_roxygen and stripped == '':
                      index -= 1
                      continue
                  break
              return sum(len(line) for line in lines[:index]) if saw_roxygen else start

          def extract(path, name, include_roxygen=False):
              text = path.read_text()
              start, end = function_span(text, name)
              if include_roxygen:
                  start = roxygen_start(text, start)
              return text[start:end].rstrip() + '\n\n'

          def remove(path, name, include_roxygen=False):
              text = path.read_text()
              start, end = function_span(text, name)
              if include_roxygen:
                  start = roxygen_start(text, start)
              path.write_text(text[:start] + text[end:])

          def append_definition(path, definition):
              text = path.read_text().rstrip() + '\n\n'
              path.write_text(text + definition)

          # Targeted reaction remapping: keep one implementation in target_union.R.
          target_path = rdir / 'target_union.R'
          target_anchor_path = rdir / 'target_union_anchors.R'
          target_text = target_path.read_text()
          core_definition = extract(
              target_anchor_path, '.rc_target_union_core_rows'
          )
          builder_definition = extract(
              target_anchor_path, '.rc_build_target_union_definition'
          )
          old_start, old_end = function_span(
              target_text, '.rc_build_target_union_definition'
          )
          target_text = target_text[:old_start] + target_text[old_end:]
          _, normalize_end = function_span(
              target_text, '.rc_target_union_normalize_ids'
          )
          target_text = (
              target_text[:normalize_end] + core_definition +
              builder_definition + target_text[normalize_end:]
          )
          target_path.write_text(target_text)
          target_anchor_path.unlink()

          # Condition comparison: the current compatibility implementation lives
          # in condition_full_contract.R; remove the superseded earlier copy.
          remove(
              rdir / 'condition_layer1.R',
              '.rc_condition_increment_summary'
          )

          # Medium construction belongs to medium.R. Preserve the published
          # evidence-aware implementation and remove both former copies.
          medium_final = extract(
              rdir / 'published_medium_contract.R',
              'rc_make_medium_scenarios',
              include_roxygen=True
          )
          remove(
              rdir / 'medium.R',
              'rc_make_medium_scenarios',
              include_roxygen=True
          )
          remove(
              rdir / 'published_medium_contract.R',
              'rc_make_medium_scenarios',
              include_roxygen=True
          )
          append_definition(rdir / 'medium.R', medium_final)

          # The final merge implementation is in metacell_object_merge.R.
          remove(
              rdir / 'metacell_fragments.R',
              'rc_load_or_merge_metacell_objects',
              include_roxygen=True
          )

          # Reaction annotation helpers are shared by annotation and evidence
          # code, so place them in one explicit utility module.
          reaction_helpers = [
              '.rc_ra_nonempty',
              '.rc_ra_first_col',
              '.rc_ra_collapse',
              '.rc_ra_split',
              '.rc_ra_infer_group_columns',
              '.rc_ra_evidence_index'
          ]
          annotation_path = rdir / 'reaction_annotations.R'
          evidence_path = rdir / 'reaction_evidence.R'
          utility_path = rdir / 'reaction_annotation_utils.R'
          utility = '# Shared helpers for reaction annotation and evidence tables.\n\n'
          for name in reaction_helpers:
              utility += extract(annotation_path, name)
          for name in reaction_helpers:
              remove(annotation_path, name)
              remove(evidence_path, name)
          utility_path.write_text(utility.rstrip() + '\n')

          # Remove the unused compatibility planner left from the retired native
          # condition engine.
          remove(rdir / 'condition_grn_contract.R', '.rc_pando_engine_control')

          description = description_path.read_text()
          description = description.replace("    'target_union_anchors.R'\n", '')
          if "    'reaction_annotation_utils.R'\n" not in description:
              description = description.replace(
                  "    'reaction_evidence.R'\n",
                  "    'reaction_annotation_utils.R'\n    'reaction_evidence.R'\n"
              )
          description_path.write_text(description)

          definitions_by_name = {}
          function_pattern = re.compile(
              r'(?m)^([A-Za-z.][A-Za-z0-9._]*)\s*<-\s*function\b'
          )
          for path in sorted(rdir.glob('*.R')):
              for match in function_pattern.finditer(path.read_text()):
                  definitions_by_name.setdefault(match.group(1), []).append(
                      str(path)
                  )
          duplicate = {
              name: paths for name, paths in definitions_by_name.items()
              if len(paths) > 1
          }
          if duplicate:
              raise RuntimeError(f'Duplicate function definitions: {duplicate}')
          if list(rdir.glob('zzz*.R')):
              raise RuntimeError('Late-loaded zzz source file remains')
          for obsolete in (
              'target_union_anchors.R',
              'step_layer1_oof.R',
              'step_layer1_common_dictionary_contract.R'
          ):
              if (rdir / obsolete).exists():
                  raise RuntimeError(f'Obsolete source remains: {obsolete}')
          collate = description_path.read_text()
          if 'target_union_anchors.R' in collate:
              raise RuntimeError('DESCRIPTION still collates target_union_anchors.R')
          if 'reaction_annotation_utils.R' not in collate:
              raise RuntimeError('DESCRIPTION lacks reaction_annotation_utils.R')
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "consolidate functional source definitions"
          git push origin HEAD:${{ github.head_ref }}
