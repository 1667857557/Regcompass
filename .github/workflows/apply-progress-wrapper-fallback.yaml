name: Apply progress wrapper fallback

on:
  push:
    branches:
      - agent/prune-obsolete-api-readme-flow
    paths:
      - 'tools/fix_progress_wrapper_dependencies.py'
      - '.github/workflows/apply-progress-wrapper-fallback.yaml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[progress-fallback]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prune-obsolete-api-readme-flow
          fetch-depth: 0

      - name: Migrate progress-aware wrappers
        run: |
          python tools/fix_progress_wrapper_dependencies.py
          git diff --check

      - name: Parse transformed R sources
        shell: Rscript {0}
        run: |
          files <- list.files('R', pattern = '[.]R$', full.names = TRUE)
          for (file in files) parse(file = file)

      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No progress wrapper changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R tests/testthat
          git commit -m '[progress-fallback] Make canonical wrappers standalone-safe'
          git push origin HEAD:agent/prune-obsolete-api-readme-flow
