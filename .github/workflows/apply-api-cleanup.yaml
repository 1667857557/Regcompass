name: Apply API cleanup

on:
  push:
    branches:
      - agent/prune-obsolete-api-readme-flow
    paths:
      - 'tools/apply_api_cleanup.py'
      - 'tools/apply_api_cleanup_v2.py'
      - 'tools/apply_api_cleanup_v3.py'
      - '.github/workflows/apply-api-cleanup.yaml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[api-cleanup]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prune-obsolete-api-readme-flow
          fetch-depth: 0

      - name: Apply deterministic cleanup
        run: python tools/apply_api_cleanup_v3.py

      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R DESCRIPTION README.md
          git commit -m '[api-cleanup] Consolidate internal API implementations'
          git push origin HEAD:agent/prune-obsolete-api-readme-flow
