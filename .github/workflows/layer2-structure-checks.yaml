name: Layer 2 structural builder checks

on:
  pull_request:
    paths:
      - 'R/fastcore.R'
      - 'R/full_gem.R'
      - 'R/microcompass_engine.R'
      - 'R/layer2_corda_runtime_step.R'
      - 'R/step_layer2.R'
      - 'tests/full-gem-synthetic-check.R'
      - 'tests/testthat/test_full_gem.R'
      - '.github/workflows/layer2-structure-checks.yaml'
  push:
    branches: [Main]
    paths:
      - 'R/fastcore.R'
      - 'R/full_gem.R'
      - 'R/microcompass_engine.R'
      - 'R/layer2_corda_runtime_step.R'
      - 'R/step_layer2.R'
      - 'tests/full-gem-synthetic-check.R'
      - 'tests/testthat/test_full_gem.R'
      - '.github/workflows/layer2-structure-checks.yaml'

permissions:
  contents: read

jobs:
  structural-builders:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install solver dependency
        shell: Rscript {0}
        run: install.packages("highs")

      - name: Parse structural builder sources and tests
        shell: Rscript {0}
        run: |
          files <- c(
            "R/fastcore.R",
            "R/full_gem.R",
            "R/microcompass_engine.R",
            "R/layer2_corda_runtime_step.R",
            "R/step_layer2.R",
            "tests/full-gem-synthetic-check.R",
            "tests/testthat/test_full_gem.R"
          )
          for (file in files) parse(file = file)

      - name: Run medium-pruned full-GEM regression
        run: Rscript tests/full-gem-synthetic-check.R

      - name: Audit mutually exclusive builder contract
        shell: python
        run: |
          from pathlib import Path

          full = Path("R/full_gem.R").read_text()
          dispatch = Path("R/layer2_corda_runtime_step.R").read_text()
          engine = Path("R/microcompass_engine.R").read_text()

          required_full = [
              '.rc_validate_full_gem_model_params',
              '"medium_flux_consistency_pruned_full_gem"',
              '.rc_fastcc_consistent_reactions',
              '.rc_full_gem_medium_fingerprint',
              'medium_fingerprint = medium_fingerprint',
              'fastcore_executed = FALSE',
              'corda2_executed = FALSE',
              'reaction_evidence_used = FALSE',
          ]
          missing = [value for value in required_full if value not in full]
          if missing:
              raise RuntimeError(f"full-GEM implementation missing: {missing}")

          required_dispatch = [
              'model_completion = "none"',
              'structural_completion <- "medium_flux_consistency"',
              'fastcore_executed <- FALSE',
              'corda2_executed <- FALSE',
          ]
          missing = [value for value in required_dispatch if value not in dispatch]
          if missing:
              raise RuntimeError(f"Layer 2 completion contract missing: {missing}")

          required_engine = [
              'time_limit = model_params$completion_time_limit %||% 300',
              'flux_consistency_epsilon = flux_threshold',
              'completion_method"), "none"',
          ]
          missing = [value for value in required_engine if value not in engine]
          if missing:
              raise RuntimeError(f"full-GEM engine integration missing: {missing}")

          production = [
              Path("R/full_gem.R"),
              Path("R/microcompass_engine.R"),
              Path("R/layer2_corda_runtime_step.R"),
          ]
          for file in production:
              text = file.read_text()
              for marker in ("_base <-", "before_full_gem", "completion_base <-"):
                  if marker in text:
                      raise RuntimeError(
                          f"function override marker remains in {file}: {marker}"
                      )
